<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/ad/managerUser/mSaveResume/'+${user.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-12">
                        <label>
                            Họ và tên : <input th:value="${user.getName()}" name="name" required>
                        </label>

                        <label style="margin-bottom: 0.5rem" th:if="${user.power!=4}">
                            Chức vụ: <input th:value="1" name="power"  type="radio" th:text="'Trưởng khoa'" th:checked="${user.power==1}">
                            <input th:value="2" name="power"  type="radio" th:text="'Phó khoa'" th:checked="${user.power==2}">
                            <input th:value="3" name="power"  type="radio" th:text="'Cán bộ khoa'" th:checked="${user.power==3}">
                        </label>
                        <br>
                        <div th:if="${resume != null}">
                            <label style="margin-bottom: 0.5rem" th:if="${user.power !=4}">
                                Mã cán bộ : <input class="autoWidthInput" th:value="${resume.getCode()}" disabled></label>
                            <label style="margin-bottom: 0.5rem" th:if="${user.power==4}">Mã sinh viên : <input class="autoWidthInput" th:value="${resume.getCode()}" required></label>
                            <br>
                            <label style="margin-bottom: 0.5rem">email :<input type="email" class="autoWidthInput" name="email" th:value="${resume.getEmail()}" required></label><br>
                            <label style="margin-bottom: 0.5rem">Số điện thoại : <input type="text" class="autoWidthInput" name="phone" th:value="${resume.getPhone()}" required></label><br>
                            <label style="margin-bottom: 0.5rem">Địa chỉ : <input type="text" class="autoWidthInput" name="address" th:value="${resume.getAddress()}" required></label><br>
                            <label style="margin-bottom: 0.5rem">Ngày sinh : <input type="date" class="autoWidthInput" name="birthday" th:value="${resume.getBirthday()}" required></label>
                        </div>
                        <div th:if="${resume==null}">
                            <span style="color: red">Người dùng chưa nhập thông tin</span>
                        </div>
                        <br>
                        <input  type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
