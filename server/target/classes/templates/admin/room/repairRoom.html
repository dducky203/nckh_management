<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Tạo mới người dùng</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<section class="showcase" style="align-content: center" layout:fragment="content">
    <div class="container mt-5">
        <h2 class="mb-4">Sửa thông tin phòng</h2>
        <p style="color: red" th:text="${message}"></p>
        <form th:action="@{'/ad/managerRoom/saveRepairRoom/'+${room.id}}" method="post">
            <!-- Thông tin bảng room -->
            <div class="form-group">
                <label for="roomName">Tên phòng</label>
                <input type="text" class="form-control" th:value="${room.roomName}"
                       id="roomName" name="roomName" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ phòng</label>
                <input type="text" class="form-control" th:value="${room.address}"
                       id="address" name="address" required maxlength="250">
            </div>
            <button type="submit" class="btn btn-primary">Lưu</button>
        </form>
    </div>
</section>

</body>
</html>
