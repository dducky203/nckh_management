<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}"
>
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" type="text/css" />
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link th:href="@{/assets/user/css/styles.css}" rel="stylesheet" />
  <style>
    /* Đảm bảo reset các padding/margin cơ bản */
    ul, li {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* Bố cục dòng */
    .row {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    /* Tiêu đề loại tiêu chí */
    .col-12 h5 {
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      margin-bottom: 10px;
    }

    /* Danh sách dropdown mặc định ẩn */
    .dropdown-menu {
      display: none;
      position: absolute;
      background-color: #ffffff;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
      min-width: 200px;
      z-index: 1000;
      border-radius: 6px;
      padding: 10px 0;
    }

    /* Khi hover vào h5 thì hiện dropdown-menu */
    .col-12:hover .dropdown-menu {
      display: block;
    }

    /* Các mục trong dropdown */
    .dropdown-item {
      display: block;
      padding: 10px 20px;
      color: #333;
      text-decoration: none;
      transition: background 0.3s;
    }

    .dropdown-item:hover {
      background-color: #f0f0f0;
      color: #000;
    }
    .criteria-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .criteria-item {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid #007bff;
      border-radius: 4px;
      text-decoration: none;
      color: #007bff;
      background-color: #f8f9fa;
      transition: background-color 0.2s;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .criteria-item:hover {
      background-color: #e2e6ea;
    }

    /* Nếu tiêu chí dài thì xuống dòng */
    .criteria-item.long-text {
      white-space: normal;
      flex: 1 1 100%;
    }


  </style>
</head>
<body>
<!--<div th:replace="user/header :: header"></div>-->
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
  <div class="container" th:if="${session.saveAdmin!=null}">
    <div class="row" >
      <h5>Bạn đang thay đổi định mức hoạt động cho <span th:text="${user.name}"></span></h5>
      <div th:if="${errors != null}">
        <ul>
          <li th:each="err : ${errors}" th:text="${err}"></li>
        </ul>
      </div>

      <div class="col-12 mb-4" th:if="${ncmListWrapper != null}">
        <form th:action="@{'/ad/managerGroup/updateList/'+${idGroup}+'/'+${user.id}}" method="post" th:object="${ncmListWrapper}" lang="en">
          <div>
            <label th:if="${year == T(java.time.LocalDate).now().year}">Chức vụ :
              <select th:value="${distintUserInNcm.roleOfTeam}"
                      name="roleOfTeam" style="width: 120px;" >
                <!--            <option th:value="null" th:selected="${distintUserInNcm.roleOfTeam == null}">Thành viên</option>-->
                <option th:value="1" th:selected="${distintUserInNcm.roleOfTeam == 1}">Trưởng nhóm</option>
                <option th:value="2" th:selected="${distintUserInNcm.roleOfTeam == 2}">Thư ký</option>
                <option th:value="3" th:selected="${distintUserInNcm.roleOfTeam == 3}">Thành viên</option>
              </select>
            </label>
            <label th:if="${year != T(java.time.LocalDate).now().year}">Chức vụ :
              <select th:value="${distintUserInNcm.roleOfTeam}"
                      name="roleOfTeam" style="width: 120px;" >
                <!--            <option th:value="null" th:selected="${distintUserInNcm.roleOfTeam == null}">Thành viên</option>-->
                <option  th:selected="${distintUserInNcm.roleOfTeam == 1}">Trưởng nhóm</option>
                <option  th:selected="${distintUserInNcm.roleOfTeam == 2}">Thư ký</option>
                <option  th:selected="${distintUserInNcm.roleOfTeam == 3}">Thành viên</option>
              </select>
            </label>
          </div>
          <table border="1" cellspacing="0" cellpadding="8" style="border-collapse: collapse; width: 100%;">
            <thead>
            <tr>
              <th>Loại hoạt động</th>
              <th>Hoạt động</th>
              <th>Định mức</th>
              <th>Vai trò</th>
              <th>Xóa</th> <!-- Thêm cột mới -->
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, iterStat : *{ncmList}"
                th:if="${item.year == year}"
                th:id="'row-' + ${iterStat.index}">
              <!-- Hidden fields -->
              <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].id}" />
              <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].idUser}" />
              <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].idOperatingStandard}" />
              <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].name}" />
              <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].catalog}" />

              <!-- Loại hoạt động -->
              <td th:text="${item.catalog}" ></td>
              <!-- Hoạt động -->
              <td th:text="${item.name}" ></td>

              <!-- Định mức -->
              <td>
                <input type="number" step="0.01"
                       th:field="*{ncmList[__${iterStat.index}__].norm}"
                       style="width: 80px;" />
              </td>

              <!-- Vai trò hoạt động -->
              <td>
                <select th:field="*{ncmList[__${iterStat.index}__].roleOfActivity}" style="width: 120px;" onchange="checkForDuplicate(this)">
                  <option value="">Thành viên</option>
                  <option value="1">Chủ trì</option>
                  <option value="2">Thư ký</option>
                  <option value="3">Thành viên</option>
                </select>
              </td>

              <!-- Nút xóa -->
              <td>
                <button type="button" th:if="${year == T(java.time.LocalDate).now().year}" onclick="markRowDeleted(this)">❌</button>
                <input type="hidden" th:field="*{ncmList[__${iterStat.index}__].deleted}" value="false" />
              </td>
            </tr>
            <tr id="ncm-template" style="display: none;">
              <td>
                <input type="hidden" data-field="id" />
                <input type="hidden" data-field="idUser" th:value="${user.getId()}"/>
                <input type="hidden" data-field="roleOfTeam" th:value="${userNcm.getRoleOfTeam()}"/>
                <select style="width: 100%;" data-field="idOperatingStandard">
                  <option th:each="std : ${operatingStandard}" th:value="${std.id}" th:text="${std.catalog}+' - '+${std.name}"></option>
                </select>
              </td>
              <td>
                <input type="number" step="0.01" style="width: 80px;" data-field="norm" />
              </td>
              <td>
                <select style="width: 120px;" data-field="roleOfActivity">
                  <option value=""></option>
                  <option value="1">Chủ trì</option>
                  <option value="2">Thư ký</option>
                  <option value="3">Thành viên</option>
                </select>
              </td>
              <td>
                <button type="button" onclick="markRowDeleted(this)">❌</button>
                <input type="hidden" data-field="deleted" value="false" />
              </td>
            </tr>

            </tbody>
          </table>
          <br>
          <h5 >Tổng định mức : <span th:text="${totalNorm}"></span></h5>
          <button th:if="${year == T(java.time.LocalDate).now().year}"
                  type="button" onclick="addNewRow()">➕ Thêm hoạt động</button>
          <button th:if="${year == T(java.time.LocalDate).now().year}"
                  type="submit" style="margin-top: 20px;" >Cập nhật</button>
        </form>

      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
