<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" type="text/css" />
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/assets/user/css/styles.css}" rel="stylesheet" />


    <!-- Select2 CSS + JS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        canvas {
            max-width: 100%;
            height: auto;
        }
        .user-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div class="container" th:if="${session.saveAdmin!=null}">
        <h2>Biểu đồ thống kê số tiết thành viên nhóm NCM</h2>

        <form method="get" th:action="@{/ad/managerGroup/statistics/pie/{idGroup}(idGroup=${idGroup})}">
            <label for="year">Nhập năm:</label>
            <input type="number" id="year" name="year" th:value="${year}" min="2000" max="2100" required>
            <button type="submit">Xem</button>
        </form>

        <div style="max-width: 400px; margin: 0 auto;">
            <canvas id="ncmPieChart" width="300" height="300"></canvas>
        </div>

        <script th:inline="javascript">
            const full = [[${full}]];
            const partial = [[${partial}]];
            const low = [[${low}]];

            const ctx = document.getElementById('ncmPieChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Đạt ≥ 100%', 'Đạt 50~75%', 'Dưới 50%'],
                    datasets: [{
                        label: 'Thống kê số người',
                        data: [full, partial, low],
                        backgroundColor: ['#28a745', '#ffc107', '#dc3545'],
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: 'Tỷ lệ hoàn thành số tiết'
                        }
                    }
                }
            });
        </script>

        <hr>

        <label for="categorySelect">Chọn phân loại thành viên:</label>
        <select id="categorySelect" onchange="showCategory(this.value)">
            <option value="full">Đạt ≥100%</option>
            <option value="partial">Đạt 50~75%</option>
            <option value="low">Dưới 50%</option>
        </select>

        <div id="full" class="user-list">
            <h3>Danh sách người đạt ≥ 100%</h3>
            <ul>
                <li th:each="u : ${fullList}" th:text="${u.name}"></li>
            </ul>
        </div>

        <div id="partial" class="user-list" style="display:none">
            <h3>Danh sách người đạt 50~75%</h3>
            <ul>
                <li th:each="u : ${partialList}" th:text="${u.name}"></li>
            </ul>
        </div>

        <div id="low" class="user-list" style="display:none">
            <h3>Danh sách người đạt dưới 50%</h3>
            <ul>
                <li th:each="u : ${lowList}" th:text="${u.name}"></li>
            </ul>
        </div>

        <script>
            function showCategory(category) {
                const sections = document.querySelectorAll('.user-list');
                sections.forEach(div => div.style.display = 'none');
                document.getElementById(category).style.display = 'block';
            }
        </script>
    </div>
</section>


</body>
</html>
