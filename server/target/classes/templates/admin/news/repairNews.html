<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Đăng tin</title>
    <style>
        #news-form {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        #news-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        #news-form input[type="text"],
        #news-form textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #news-form input[type="file"] {
            margin-top: 8px;
        }
        #news-form button {
            margin-top: 20px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #news-form button:hover {
            background-color: #0056b3;
        }
        #preview {
            display: flex;
            flex-wrap: wrap;
            margin-top: 15px;
            gap: 10px;
            min-height: 100px;
            border: 2px dashed #ccc;
            padding: 10px;
        }
        .preview-image {
            position: relative;
        }
        .preview-image img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #aaa;
        }
        .remove-btn {
            position: absolute;
            top: -20px;
            right: 1px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }
        .remove-btn:hover {
            background: red;
        }
    </style>
</head>
<body>
<section style="margin-top: 3rem;margin-bottom: 2rem" layout:fragment="content">
    <div class="container">
        <form id="news-form" th:action="@{'/ad/managerNews/saveRepairedNews/' + ${news.id}}" method="POST" enctype="multipart/form-data">
            <label for="title">Tiêu đề:</label>
            <input type="text" id="title" name="title" th:value="${news.title}" required>

            <label for="content">Nội dung:</label>
            <textarea id="content" name="content" rows="6" required
                      th:text="${news.content}"></textarea>

            <!-- Hiển thị ảnh đã có -->
            <label>Ảnh đã đăng:</label>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                <div th:each="img : ${newsImages}" style="position: relative; display: inline-block;">
                    <img th:src="@{'/file/' + ${img.imageName}}" width="120" height="80"
                         style="border: 2px solid #d1d1d1; border-radius: 4px;" />

                    <!-- Nút xóa ảnh -->
                    <button type="button" class="remove-image-btn"
                            style="position: absolute;background-color: red;
                            right: 0px;
                            top: -20px;
                            color: white;
                            border: none;
                            border-radius: 4px;
                            cursor: pointer;"
                            th:onclick="'removeImage(this, '+${img.id}+')'">×</button>
                </div>
                <script>
                    // Mảng lưu các ID ảnh cần xóa
                    const deletedImageIds = [];

                    function removeImage(button, imageId) {
                        // Thêm vào danh sách ID ảnh cần xóa
                        deletedImageIds.push(imageId);

                        // Ẩn ảnh trong giao diện
                        button.parentElement.remove();
                    }

                    // Trước khi submit form, tạo input hidden gửi danh sách ID ảnh cần xóa
                    document.getElementById("news-form").addEventListener("submit", function (e) {
                        const input = document.createElement("input");
                        input.type = "hidden";
                        input.name = "deletedImageIds";
                        input.value = deletedImageIds.join(",");
                        this.appendChild(input);
                    });
                </script>
            </div>


            <!-- Upload thêm ảnh mới -->
            <label for="images">Ảnh mới (có thể chọn nhiều):</label>
            <input type="file" name="images" id="images" accept="image/*" multiple>

            <div id="preview"></div>

            <button type="submit" style="padding: 10px 20px;background-color: #007BFF;">Cập nhật tin</button>
            <script>
                // select ncm
                document.addEventListener("DOMContentLoaded", function () {
                    $('#addUserModal').on('shown.bs.modal', function () {
                        $('#userSelect').select2({
                                                     dropdownParent: $('#addUserModal'), // quan trọng nếu trong modal
                                                     placeholder: "Chọn người dùng...",
                                                     allowClear: true,
                                                     width: '100%'
                                                 });
                    });
                });
                // Xóa dòng mẫu trước khi submit (at ncm)
                document.addEventListener("DOMContentLoaded", function () {
                    const saveBtn = document.getElementById('saveBtn');
                    if (saveBtn) {
                        saveBtn.addEventListener('click', function () {
                            document.querySelectorAll('.activity-row.d-none').forEach(row => row.remove());
                        });
                    } else {
                        console.warn('Không tìm thấy nút #saveBtn trong DOM.');
                    }
                });
                // create event (id OS2 =25 26 27 28)
                function updateRoleSelections() {
                    const leaderSelect = document.getElementById("leaderSelect");
                    const secretarySelect = document.getElementById("secretarySelect");

                    // Clear existing options
                    leaderSelect.innerHTML = '<option value="">-- Chọn --</option>';
                    secretarySelect.innerHTML = '<option value="">-- Chọn --</option>';

                    // Populate options
                    memberUsers.forEach(user => {
                        const leaderOption = document.createElement("option");
                        leaderOption.value = user.id;
                        leaderOption.textContent = user.name;

                        const secretaryOption = leaderOption.cloneNode(true);

                        leaderSelect.appendChild(leaderOption);
                        secretarySelect.appendChild(secretaryOption);
                    });

                    // Thêm logic để đảm bảo không chọn trùng
                    leaderSelect.addEventListener("change", function () {
                        if (leaderSelect.value && leaderSelect.value === secretarySelect.value) {
                            alert("Một người không thể vừa là Trưởng nhóm vừa là Thư ký.");
                            leaderSelect.value = "";
                        }
                    });

                    secretarySelect.addEventListener("change", function () {
                        if (secretarySelect.value && secretarySelect.value === leaderSelect.value) {
                            alert("Một người không thể vừa là Trưởng nhóm vừa là Thư ký.");
                            secretarySelect.value = "";
                        }
                    });
                }

                // create news
                document.addEventListener('DOMContentLoaded', function () {
                    const input = document.getElementById('images');
                    const preview = document.getElementById('preview');
                    const form = document.getElementById('news-form');

                    let selectedFiles = [];

                    function generateId() {
                        return Date.now().toString() + Math.random().toString(36).substr(2, 9);
                    }

                    function renderPreview() {
                        preview.innerHTML = '';

                        selectedFiles.forEach(file => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'preview-image';
                            wrapper.dataset.id = file._id;

                            const img = document.createElement('img');
                            const btn = document.createElement('button');
                            btn.className = 'remove-btn';
                            btn.innerText = '✕';
                            btn.type = 'button';

                            btn.addEventListener('click', () => {
                                selectedFiles = selectedFiles.filter(f => f._id !== file._id);
                                renderPreview();
                            });

                            const reader = new FileReader();
                            reader.onload = function (e) {
                                img.src = e.target.result;
                            };
                            reader.readAsDataURL(file);

                            wrapper.appendChild(img);
                            wrapper.appendChild(btn);
                            preview.appendChild(wrapper);
                        });
                    }

                    input.addEventListener('change', function () {
                        const files = Array.from(this.files);
                        files.forEach(file => file._id = generateId());
                        selectedFiles = selectedFiles.concat(files);
                        renderPreview();
                        input.value = ''; // clear file input
                    });

                    // Drag and drop support
                    preview.addEventListener('dragover', function (e) {
                        e.preventDefault();
                        preview.style.backgroundColor = "#f0f8ff";
                    });

                    preview.addEventListener('dragleave', function (e) {
                        e.preventDefault();
                        preview.style.backgroundColor = "";
                    });

                    preview.addEventListener('drop', function (e) {
                        e.preventDefault();
                        preview.style.backgroundColor = "";
                        const dropped = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                        dropped.forEach(file => file._id = generateId());
                        selectedFiles = selectedFiles.concat(dropped);
                        renderPreview();
                    });

                    form.addEventListener('submit', function () {
                        const dataTransfer = new DataTransfer();
                        selectedFiles.forEach(file => dataTransfer.items.add(file));
                        input.files = dataTransfer.files;
                    });
                });
            </script>
        </form>


    </div>
</section>



</body>
</html>
