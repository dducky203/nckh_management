<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/ad/resume/savePass/'+${session.saveAdmin.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-12">
                        <h3>Thay mật khẩu</h3>

                        <p style="color: red" th:text="${message}"></p>
                        <label for="pass1">
                            <input type="password" id="pass1" name="pass1" placeholder="Nhập mật khẩu thứ 1 ...">
                        </label>
                        <br>
                        <label for="pass2">
                            <input type="password" id="pass2" name="pass2" placeholder="Nhập mật khẩu thứ 2 ...">
                        </label>
                        <br>
                        <input type="submit" class="btn btn-primary" style="background-color: #0dcaf0" >
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
