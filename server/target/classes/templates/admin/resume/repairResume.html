<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{'/ad/resume/'+${session.saveAdmin.getId()}}" class="btn btn-primary" style="background-color: #0d6efd">Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/ad/resume/save/'+${session.saveAdmin.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-12">
                        <h4  th:text="'Họ và tên : '+${session.saveAdmin.getName()}"></h4>
                        <p th:text="${message}" style="color: red"></p>
                        <label style="margin-bottom: 0.5rem">email :<input type="email" class="autoWidthInput" name="email" th:value="${resume?.email}"></label><br>
                        <label style="margin-bottom: 0.5rem">Số điện thoại : <input type="text" class="autoWidthInput" name="phone" th:value="${resume?.phone}"></label><br>
                        <label style="margin-bottom: 0.5rem">Địa chỉ : <input type="text" class="autoWidthInput" name="address" th:value="${resume?.address}"></label><br>
                        <label style="margin-bottom: 0.5rem">Ngày sinh : <input type="date" class="autoWidthInput" name="birthday" th:value="${resume?.birthday}"></label>
                        <br>
                        <input type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
