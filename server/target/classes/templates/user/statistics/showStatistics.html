<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase" style="align-content: center" layout:fragment="content">
    <div style="margin-left: 11rem;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li th:each="item, stat : ${breadcrumbs}"
                    th:classappend="${stat.last} ? 'breadcrumb-item active' : 'breadcrumb-item'">
                    <a style="text-decoration: none" th:if="${!stat.last}" th:href="@{${item.url}}" th:text="${item.label}"></a>
                    <span th:if="${stat.last}" th:text="${item.label}"></span>
                </li>
            </ol>
        </nav>
    </div>

    <div style="width: 70%; margin: 2rem auto;">
        <form method="post" th:action="@{/event/postStatistics}">
            <label>Chọn năm thống kê : <input type="text" name="year" ></label>
            <input type="submit" placeholder="Gửi">
        </form>

        <h3>Thống kê các sự kiện năm <span th:text="${year}"></span></h3>
        <canvas id="barChart"></canvas>


        <div class="container-fluid" style="min-height: auto;margin-top: 2rem">
            <h3>Sự kiện theo từng tháng: </h3>
            <div class="row" >
                <div class="col-1" th:each="st: ${statistics}" th:if="${st.value!=0}">
                    <a th:href="@{'/event/showEvByMonth/'+${st.getKey()}+'/'+${year}}"  th:text="'Tháng '+${st.getKey()}" style="text-decoration: none"></a>
                </div>
            </div>
            <div class="container" th:if="${events != null }">
                <h4 style="margin-left: auto">Các sự kiện tháng <span th:text="${month}"></span></h4>
                <div class="row_content" th:each="e: ${events}">
                    <div class="row" >
                        <div class="col-10">
                            <h5 th:text="${e.getEventName()}"></h5>
                        </div>
                        <div class="col-2" th:text="${e.getCreateDate()}"></div>
                        <div class="col-2" th:if="${e.getIdRoom() != null}">
                            <p >Địa điểm :<span th:text="${e.getIdRoom().roomName}"></span></p>
                        </div>
                        <div class="col-4">
                            <p>Thời gian diễn ra :<span th:text="${e.getDateOfEvent()}"></span></p>
                        </div>
                        <div class="col-4">
                            <a th:href="@{'/event/detailE/'+${e.getId()}}">xem thêm</a>
                        </div>
                    </div>

                </div>
                <nav aria-label="Page navigation example" style="margin-left: auto" >
                    <p >Bạn đang ở trang thứ <span th:text="${events.getNumber()+1}"></span></p>
                    <ul class="pagination">
                        <li class="page-item">
                            <a class="page-link"
                               th:href="@{'/event/showEvByMonth/' + ${month}+'/'+${year} + '?size=' + ${events.size} + '&page=1'}"
                               style="text-decoration: none">
                                Trang đầu
                            </a>
                        </li>
                        <div th:if="${events.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
                            <li class="page-item" style="border: var(--bs-pagination-border-width) solid var(--bs-pagination-border-color);padding: 6px">
                                <a th:href="@{'/event/showEvByMonth/' + ${month}+'/'+${year} + '?size=' + ${events.size} + '&page=' + ${pageNumber}}"
                                   th:text="${pageNumber}"
                                   th:class="${pageNumber == events.number + 1} ? 'active'"
                                   style="text-decoration: none" class="page-link">
                                </a>
                            </li>
                        </div>
                        <li class="page-item">
                            <a class="page-link"
                               th:if="${maxPageNumber !=null}"
                               style="text-decoration: none"
                               th:href="@{'/event/showEvByMonth/' + ${month}+'/'+${year} + '?size=' + ${events.size} + '&page=' + ${maxPageNumber}}"
                            >
                                Trang cuối
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>

    </div>

    <!-- Chuyển dữ liệu từ Thymeleaf sang JavaScript -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        let rawLabels = [[${statistics.keySet()}]]; // ["1", "2", "3", ...]
        let labels = rawLabels.map(m => "Tháng " + m); // Thêm chữ "Tháng " vào từng phần tử
        let data = [[${statistics.values()}]];
        /*]]>*/
    </script>

    <!-- Thêm script của Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('barChart').getContext('2d');
        const barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels, // các tháng
                datasets: [{
                    label: 'Tổng sự kiện',
                    data: data, // giá trị tương ứng
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</section>
</body>
</html>
