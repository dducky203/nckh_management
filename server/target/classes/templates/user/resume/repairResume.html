<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{'/user/resume/'+${session.saveUser.getId()}}" class="btn btn-primary" style="background-color: #0d6efd">Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/user/resume/save/'+${session.saveUser.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-3"></div>
                    <div class="col-6">
                        <h4  th:text="'Họ và tên : '+${user.getName()}"></h4>
                        <label style="margin-bottom: 0.5rem" th:if="${user.getPower()==4}">Mã sinh viên : <input class="autoWidthInput" th:value="${resume.getCode()}" disabled></label>
                        <label style="margin-bottom: 0.5rem" th:if="${user.getPower()==1 or user.getPower()==2 or user.getPower()==3}">Mã cán bộ : <input class="autoWidthInput" th:value="${resume.getCode()}" disabled></label>
                        <label style="margin-bottom: 0.5rem" th:if="${user.getPower() == 1}">Chức vụ: <input  type="text" value="Trưởng khoa" disabled><br></label><br>
                        <label style="margin-bottom: 0.5rem" th:if="${user.getPower() == 2}">Chức vụ: <input  type="text" value="Phó khoa" disabled></label>
                        <label style="margin-bottom: 0.5rem" th:if="${user.getPower() == 3}" >Chức vụ: <input  type="text" value="Cán bộ khoa" disabled></label>
                        <label style="margin-bottom: 0.5rem">email :<input type="email" class="autoWidthInput" name="email" th:value="${resume?.getEmail()}"></label><br>
                        <p th:text="${message}" style="color: red"></p>
                        <label style="margin-bottom: 0.5rem">Số điện thoại : <input type="text" class="autoWidthInput" name="phone" th:value="${resume?.getPhone()}"></label><br>
                        <label style="margin-bottom: 0.5rem">Địa chỉ : <input type="text" class="autoWidthInput" name="address" th:value="${resume?.getAddress()}"></label><br>
                        <label style="margin-bottom: 0.5rem">Ngày sinh : <input type="date" class="autoWidthInput" name="birthday" th:value="${resume?.getBirthday()}"></label>
                        <br>
                        <input type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                    </div>
                    <div class="col-3"></div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
