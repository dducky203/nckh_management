<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Đăng tin</title>
    <style>
        #news-form {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        #news-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        #news-form input[type="text"],
        #news-form textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #news-form input[type="file"] {
            margin-top: 8px;
        }
        #news-form button {
            margin-top: 20px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #news-form button:hover {
            background-color: #0056b3;
        }
        #preview {
            display: flex;
            flex-wrap: wrap;
            margin-top: 15px;
            gap: 10px;
            min-height: 100px;
            border: 2px dashed #ccc;
            padding: 10px;
        }
        .preview-image {
            position: relative;
        }
        .preview-image img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #aaa;
        }
        .remove-btn {
            position: absolute;
            top: -20px;
            right: 1px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }
        .remove-btn:hover {
            background: red;
        }
    </style>
</head>
<body>
<section style="margin-top: 3rem;margin-bottom: 2rem" layout:fragment="content">
    <div class="container">
        <form id="news-form" th:action="@{'/news/saveNews/'+${session.saveUser.id}}" method="POST" enctype="multipart/form-data">
            <label for="title">Tiêu đề:</label>
            <input type="text" id="title" name="title" required>

            <label for="content">Nội dung:</label>
            <textarea id="content" name="content" rows="6" required></textarea>

            <label for="images">Ảnh (có thể chọn nhiều):</label>
            <input type="file" name="images" id="images" accept="image/*" multiple>

            <div id="preview"></div>

            <button type="submit" style="padding: 10px 20px;background-color: #007BFF;">Đăng tin</button>
        </form>
    </div>
</section>


</body>
</html>
