<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    >
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>
<nav class="navbar   static-top" th:fragment="header" style="margin-bottom: 2rem;background-color: #034657">
    <div class="container">
        <ul class="nav nav-tabs w-100 align-items-center" style="border-bottom: none">
            <!-- Logo (disabled tab) -->
            <li class="nav-item">
                <a class="nav-link disabled p-0">
                    <img style="width: 5rem;" class="navbar-brand" th:src="@{/file/logo_fita.png}" alt="Logo FITA">
                </a>
            </li>
            <!-- Tabs bên trái -->
            <!-- Nếu đã đăng nhập và chưa có NCM -->
            <li class="nav-item" th:if="${session.saveUser != null and session.saveNcm == null}">
                <a class="nav-link" style="color: white"
                   th:if="${session.saveUser.power == 3 || session.saveUser.power == 4}"
                   th:href="@{'/event/showE/' + ${session.saveUser.getId()}}">
                    Xem / tạo sự kiện
                </a>
                <a class="nav-link" style="color: white"
                   th:if="${session.saveUser.power == 1 || session.saveUser.power == 2}"
                   th:href="@{'/event/showEvManagement'}">
                    Quản lý sự kiện
                </a>
            </li>

            <!-- Nếu đã đăng nhập và có NCM -->
            <li class="nav-item" th:if="${session.saveUser != null and session.saveNcm != null}">
                <!-- Quản lý sự kiện nếu là trưởng nhóm (1) hoặc thư ký (2), đúng năm và đúng user -->
                <a class="nav-link" style="color: white"
                   th:if="${(session.saveUser.power == 1 || session.saveUser.power == 2 || session.saveUser.power == 3)
                           and session.saveNcm.idUser == session.saveUser.id
                           and (session.saveNcm.roleOfTeam == 1 || session.saveNcm.roleOfTeam == 2)
                           and session.saveNcm.year == session.currentYear}"
                   th:href="@{/event/showEvManagement}">
                    Quản lý sự kiện
                </a>

                <!-- Nếu là thành viên (roleOfTeam == 3), quyền power == 3 -->
                <a class="nav-link" style="color: white"
                   th:if="${session.saveUser.power == 3
                           and session.saveNcm.idUser== session.saveUser.id
                           and session.saveNcm.roleOfTeam == 3}"
                   th:href="@{'/event/showE/' + ${session.saveUser.getId()}}">
                    Xem / tạo sự kiện
                </a>
            </li>

            <li class="nav-item" th:if="${session.saveUser != null}">
                <a style="color: white" class="nav-link" th:href="@{'/user/resume/' + ${session.saveUser.getId()}}">Hồ sơ</a>
            </li>

            <li class="nav-item"
                th:if="${session.saveUser != null
                and (session.saveUser.getPower() == 1 or session.saveUser.getPower() == 2)
                or (session.saveNcm!=null and (session.saveNcm.roleOfTeam == 1 or session.saveNcm.roleOfTeam == 2))
                }">
                <a style="color: white" class="nav-link" th:href="@{/user/manager}">Quản lý nhân sự</a>
            </li>
            <li class="nav-item"
                th:if="${session.saveUser != null
                and (session.saveUser.getPower() == 1 or session.saveUser.getPower() == 2)}">
                <a style="color: white" class="nav-link" th:href="@{/news/managerNews}">Quản lý tin tức</a>
            </li>
            <li class="nav-item" th:if="${session.saveUser != null and (session.saveUser.getPower() != 1 && session.saveUser.getPower() != 2)}">
                <a style="color: white" class="nav-link" th:href="@{'/news/yourNews/'+${session.saveUser.id}}">Tin tức của bạn</a>
            </li>
            <li class="nav-item" th:if="${session.saveUser != null and (session.saveUser.getPower() == 1 or session.saveUser.getPower() == 2)}">
                <a style="color: white" class="nav-link" th:href="@{/event/statistics}">Thống kê</a>
            </li>

            <li class="nav-item" th:if="${session.saveUser != null && session.saveUser.power!=4}" >
                <a style="color: white" class="nav-link"
                   th:href="@{'/ncm/normStatistics/'+${session.saveUser.id}+'/'+${session.currentYear}}">
                    Định mức hoạt động
                </a>
            </li>
            <!--  luôn nằm cuối cùng bên phải -->
            <li class="nav-item ms-auto" th:if="${session.saveUser != null}">
                <a style="color: greenyellow;margin-left: auto" class="nav-link disabled"
                   th:text="'Xin chào ' + ${session.saveUser.getName()}"></a>
            </li>
            <li class="nav-item ms-auto" th:if="${session.saveUser == null}">
                <a class="nav-link btn btn-primary text-white" style="margin-left: auto;" th:href="@{/login}">Đăng nhập</a>
            </li>

            <li class="nav-item ms-auto" th:if="${session.saveUser != null}">
                <a class="nav-link btn text-white" style="background-color: orangered; margin-left: auto;" th:href="@{/login/logout}">Đăng xuất</a>
            </li>
        </ul>
    </div>
    <div class="clear" style="clear: both"></div>
    <span class="i-lineLeft"></span>
    <span class="i-lineRight" ></span>
</nav>

</body>
</html>
