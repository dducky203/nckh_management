<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{/assets/user/manager}" class="btn btn-primary" style="background-color: #0d6efd">Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/user/mSaveResume/'+${user.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-3"></div>
                    <div class="col-6">
                        <h4  th:text="'Họ và tên : '+${user.getName()}"></h4>

                        <label style="margin-bottom: 0.5rem" th:if="${session.saveUser.getPower()==1}">
                            Chức vụ: <input th:value="1" name="power"  type="radio" th:text="'Trưởng khoa'" th:checked="${user.getPower()==1}">
                                <input th:value="2" name="power"  type="radio" th:text="'Phó khoa'" th:checked="${user.getPower()==2}">
                                <input th:value="3" name="power"  type="radio" th:text="'Cán bộ khoa'" th:checked="${user.getPower()==3}">
                        </label>
                        <label style="margin-bottom: 0.5rem" th:if="${session.saveUser.getPower()==2}">
                            Chức vụ: <input th:value="1" name="power"  type="radio" th:text="'Trưởng khoa'" th:checked="${user.getPower()==1}" disabled>
                            <input th:value="2" name="power"  type="radio" th:text="'Phó khoa'" th:checked="${user.getPower()==2}" disabled>
                            <input th:value="3" name="power"  type="radio" th:text="'Cán bộ khoa'" th:checked="${user.getPower()==3}" disabled>
                        </label>
                        <br>
                        <div th:if="${resume != null}">
                            <label style="margin-bottom: 0.5rem" th:if="${user.getPower()==1 or user.getPower()==2 or user.getPower()==3}">
                                Mã cán bộ : <input class="autoWidthInput" th:value="${resume.getCode()}" disabled></label>
                            <label style="margin-bottom: 0.5rem" th:if="${user.getPower()==4}">Mã sinh viên : <input class="autoWidthInput" th:value="${resume.getCode()}" disabled></label>
                            <br>
                            <label style="margin-bottom: 0.5rem">email :<input type="email" class="autoWidthInput" name="email" th:value="${resume.getEmail()}" disabled></label><br>
                            <label style="margin-bottom: 0.5rem">Số điện thoại : <input type="text" class="autoWidthInput" name="phone" th:value="${resume.getPhone()}" disabled></label><br>
                            <label style="margin-bottom: 0.5rem">Địa chỉ : <input type="text" class="autoWidthInput" name="address" th:value="${resume.getAddress()}" disabled></label><br>
                            <label style="margin-bottom: 0.5rem">Ngày sinh : <input type="date" class="autoWidthInput" name="birthday" th:value="${resume.getBirthday()}" disabled></label>
                        </div>
                        <div th:if="${resume==null}">
                            <span style="color: red">Người dùng chưa nhập thông tin</span>
                        </div>
                        <br>
                        <input th:if="${session.saveUser.getPower()==1}" type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                    </div>
                    <div class="col-3"></div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
