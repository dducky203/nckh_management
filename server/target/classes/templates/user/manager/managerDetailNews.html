<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .indent {
            display: inline-block;
            text-indent: 2em;
        }
        .like-count {
            font-size: 0.7rem;
            padding: 0.25rem 0.4rem;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 2px;">
        <a th:href="@{'/'}" class="btn btn-primary" style="margin-bottom: 2rem">Quay lại</a>
        <br>
        <a style="padding: 5px" th:if="${news.status==1}" class="btn btn-primary" th:href="@{'/news/browseNews/'+${news.id}}">Duyệt tin tức</a>
    </div>
    <div class="container my-5">
        <div class="row">
            <div class="col-12" >
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <!-- Tiêu đề và thời gian -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title text-primary mb-0">
                                Tiêu đề: <span th:text="${news.title}"></span>
                            </h5>
                            <small class="text-muted" th:if="${news.time != null}"
                                   th:text="${#temporals.format(news.time, 'dd/MM/yyyy HH:mm')}"></small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 >Người đăng tin : <span th:text="${news.user.name}"></span></h6>
                            <small class="text-muted" >
                                Trạng thái : <span style="color: red" th:if="${news.status==1}">Chờ duyệt</span>
                                            <span style="color: greenyellow" th:if="${news.status==2}">Đã duyệt</span>
                            </small>
                        </div>


                        <!-- Nội dung tin -->
                        <p th:utext="${news.content}"></p>
                        <!-- Hình ảnh -->
                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3 mt-3">
                            <div class="col" th:each="img : ${newsImages}">
                                <img th:src="@{'/file/' + ${img.imageName}}"
                                     class="img-fluid rounded shadow-sm w-100"
                                     style="object-fit: cover; height: 200px;"
                                     alt="News image">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${session.saveUser!=null}">
                <div class="like-container position-relative d-inline-block">

                    <!-- Nút xem danh sách người đã thích -->
                    <button class="btn btn-sm btn-danger position-relative ms-2"
                            th:onclick="'toggleLikeList(' + ${news.id} + ')'"
                            th:id="'like-count-btn-' + ${news.id}"
                            th:text="${likeCount} + ' lượt thích'">
                    </button>


                    <!-- Danh sách người thích -->
                    <div th:id="'like-list-' + ${news.id}"
                         class="card p-2 mt-2 shadow"
                         style="margin-left: -3rem;display: none; position: absolute; z-index: 10; background: white;height: 100px;overflow-y: auto">
                        <ul th:id="'like-users-' + ${news.id}" class="list-unstyled mb-0">
                            <li>Đang tải...</li>
                        </ul>
                    </div>

                </div>

                <button style="margin-left: 1rem" class="btn btn-outline-info" th:onclick="'copyShareLink()'">🔗 Sao chép liên kết</button>

                <script>
                    function toggleLike(userId, newsId) {
                        fetch(`/likes/${userId}/${newsId}`, {
                            method: 'POST'
                        })
                            .then(response => response.json())
                            .then(data => {
                                // cập nhật số like
                                const likeBtn = document.getElementById(`like-count-btn-${newsId}`);
                                if (likeBtn) {
                                    likeBtn.innerText = `${data.likeCount} lượt thích`;
                                }

                                // cập nhật màu nút thích
                                const btnLike = document.getElementById(`like-button-${newsId}`);
                                if (btnLike) {
                                    if (data.userLiked) {
                                        btnLike.classList.remove('btn-outline-secondary');
                                        btnLike.classList.add('btn-success');
                                    } else {
                                        btnLike.classList.remove('btn-success');
                                        btnLike.classList.add('btn-outline-secondary');
                                    }
                                }
                            })
                            .catch(error => {
                                console.error('Lỗi khi gửi like:', error);
                            });
                    }
                    function toggleLikeList(newsId) {
                        const listDiv = document.getElementById(`like-list-${newsId}`);
                        const userList = document.getElementById(`like-users-${newsId}`);

                        if (listDiv.style.display === 'none') {
                            listDiv.style.display = 'block';

                            fetch(`/likes/users/${newsId}`)
                                .then(res => res.json())
                                .then(users => {
                                    userList.innerHTML = '';
                                    if (users.length === 0) {
                                        userList.innerHTML = '<li>Chưa có ai thích bài viết này</li>';
                                    } else {
                                        users.forEach(user => {
                                            const li = document.createElement('li');
                                            li.textContent = user.name;
                                            userList.appendChild(li);
                                        });
                                    }
                                })
                                .catch(err => {
                                    console.error("Lỗi khi lấy danh sách like:", err);
                                    userList.innerHTML = '<li>Lỗi khi tải danh sách</li>';
                                });

                        } else {
                            listDiv.style.display = 'none';
                        }
                    }
                    function copyShareLink() {
                        const url = window.location.href;
                        navigator.clipboard.writeText(url).then(() => {
                            alert('Đã sao chép liên kết bài viết!');
                        }, () => {
                            alert('Không thể sao chép liên kết.');
                        });
                    }
                    // comment
                    function loadComments(newsId) {
                        fetch(`/comments/${newsId}`)
                            .then(response => response.json())
                            .then(comments => {
                                const commentList = document.getElementById("comment-list");
                                commentList.innerHTML = '';

                                if (comments.length === 0) {
                                    commentList.innerHTML = '<div class="text-muted">Chưa có bình luận nào.</div>';
                                    return;
                                }

                                comments.forEach(c => {
                                    const div = document.createElement('div');
                                    div.className = 'border p-2 rounded mb-2 d-flex justify-content-between align-items-end';
                                    div.innerHTML = `
                                        <div><strong>${c.user}:</strong> ${c.comment}</div>
                                        <small class="text-muted" style="white-space: nowrap;">${c.time}</small>
                                    `;
                                    commentList.appendChild(div);
                                });


                            });
                    }

                    function submitComment(event) {
                        event.preventDefault();
                        const textarea = document.getElementById("comment-input");
                        const content = textarea.value.trim();
                        if (content === "") return;

                        const newsId = [[${news.id}]];
                        const formData = new URLSearchParams();
                        formData.append("comment", content);

                        fetch(`/comments/${newsId}`, {
                            method: 'POST',
                            body: formData
                        })
                            .then(res => {
                                if (res.ok) {
                                    textarea.value = "";
                                    loadComments(newsId);
                                } else {
                                    alert("Bạn cần đăng nhập để bình luận.");
                                }
                            });
                    }

                    document.addEventListener('DOMContentLoaded', function () {
                        loadComments([[${news.id}]]);
                    });

                </script>
            </div>
        </div>
    </div>
</section>


</body>
</html>
