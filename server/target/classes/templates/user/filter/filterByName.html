<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div style="margin-left: 11rem;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li th:each="item, stat : ${breadcrumbs}"
                    th:classappend="${stat.last} ? 'breadcrumb-item active' : 'breadcrumb-item'">
                    <a style="text-decoration: none" th:if="${!stat.last}" th:href="@{${item.url}}" th:text="${item.label}"></a>
                    <span th:if="${stat.last}" th:text="${item.label}"></span>
                </li>
            </ol>
        </nav>
    </div>
    <div style="position: fixed;top: 200px;left: 10px;">
        <a th:href="${'/'}" class="btn btn-primary" style="background-color: #0d6efd">Quay lại</a>
    </div>
    <div class="container" >
        <div class="row">
            <div class="col-1"></div>
            <div class="col-10" style="align-content: center">
                <ul  class="nav nav-tabs">
                    <li style="margin-right: 0.5rem" class="nav-item" th:each="op :${operatingStandards2}"
                        th:if="${op.getIdTypeOfCriteria().id == idTypeOfCriteria && op.id != 2&&op.id!=6}">
                        <a class="nav-link" th:href="@{'/filter/operatingStandard/'+${idTypeOfCriteria}+'/'+${op.getId()}}" th:text="${op.getName()}"></a>
                    </li>
                </ul>
            </div>
            <div class="col-1"></div>
        </div>
        <div class="row_content" th:each="e: ${events}" th:if="${e.status==2}">
            <div class="row" >
                <div class="col-10">
                    <h4 th:text="${e.getEventName()}"></h4>
                </div>
                <div class="col-2" th:text="${e.getCreateDate()}"></div>
                <div class="col-2">
                    <p >Địa điểm :<span th:text="${e.getIdRoom()}"></span></p>
                </div>
                <div class="col-4">
                    <p>Thời gian diễn ra :<span th:text="${e.getDateOfEvent()}"></span></p>
                </div>
                <div class="col-4">
                    <a th:href="@{'/event/detail/'+${e.getId()}}">xem thêm</a>
                </div>
            </div>

        </div>
    </div>
    <nav aria-label="Page navigation example" style="margin-left: 9.5rem" >
        <p >Bạn đang ở trang thứ <span th:text="${events.getNumber()+1}"></span></p>
        <ul class="pagination">
            <li class="page-item"><a class="page-link" th:href="@{/(size=${pageSize}, page=1)}" style="text-decoration: none">Trang đầu</a></li>
            <div th:if="${events.totalPages > 0}"
                 th:each="pageNumber : ${pageNumbers}">
                <li class="page-link" >
                    <a th:href="@{/(size=${events.size}, page=${pageNumber})}"
                       th:text="${pageNumber}"
                       th:class="${pageNumber==events.number + 1} ? active"
                       style="text-decoration: none"
                       class="page-link"
                    ></a>
                </li>
            </div>
            <li class="page-item"><a class="page-link" style="text-decoration: none" th:href="@{/(size=${events.size}, page=${maxPageNumber})}">Trang cuối</a></li>
        </ul>
    </nav>
</section>


</body>
</html>
