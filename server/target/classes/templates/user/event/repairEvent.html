<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{'/event/showE/'+${session.saveUser.getId()}}" class="btn btn-primary" >Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <form id="eventForm"  th:action="@{'/event/saveE/'+${event.getId()}}" enctype="multipart/form-data" th:object="${allEventDto}" method="post">
            <div class="row">
                    <div class="col-8">
                        <p th:text="${message}" style="color: red"></p>
                        <input name="id" th:field="*{event.id}" hidden="hidden">
                        <input name="isDelete" th:field="*{event.isDelete}" hidden="hidden">
                        <input name="status" th:field="*{event.status}" hidden="hidden">
                        <input name="id" th:field="*{event.idOperatingStandard2}" hidden="hidden">
                        <label>Tên sự kiện : <input class="autoWidthInput"  name="nameEvent" th:field="*{event.eventName}" required></label><br>
                        <input class="autoWidthInput" th:field="*{event.creator}" name="creator" hidden="hidden">
                        <label>Người tạo sự kiện : <input class="autoWidthInput" th:value="${creator.getName()}" readonly></label><br>
                        <input th:field="*{event.createDate}" hidden="hidden">
                        <div th:if="${typeOfCriterion.id !=3 && typeOfCriterion.id!=4}">
                            <label>Tiết bắt đầu : <input required type="number" class="autoWidthInput" name="startTime" th:field="*{event.startTime}"> -- tiết kết thúc : <input required type="number" class="autoWidthInput" name="endTime" th:field="*{event.endTime}"></label><br>
                            <input th:field="*{event.idOperatingStandard2}" hidden="hidden">
                            <div th:each="room :${rooms}">
                                <p th:if="${event.getIdRoom() == room.getId()}" th:text="'Phòng diễn ra hiện tại: '+${room.getRoomName()}+' -- địa chỉ: '+${room.getAddress()}"></p>
                            </div>
                            <!-- Link để hiển thị danh sách phòng -->
                            <label style="color: orangered">
                                Chọn phòng tổ chức sự kiện mới :
                                <a href="#" onclick="toggleRoomList()">Chọn</a>
                            </label><br>
                            <!-- Danh sách các phòng -->
                            <div id="roomList" style="display: none; margin: 10px;overflow: auto;height: 300px;border: black solid 1px;border-radius: 10px">
                                <ul>
                                    <li th:each="room : ${rooms}">
                                        <label>
                                            <input type="radio" name="idRoom"
                                                   th:value="${room.id}"
                                                   th:checked="${event.getIdRoom() == room.getId()}"
                                                   th:field="*{event.idRoom}"/>
                                            <span th:text="${room.roomName} + ' - ' + ${room.address}"></span>
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>

<!--                        search-->
                        <div>
                            <label>Tìm người dùng:</label>
                            <input type="text" id="searchInput" placeholder="Nhập tên...">
                            <button type="button" onclick="searchUsers()">Tìm</button>
                        </div>

                        <!-- Hiển thị kết quả tìm kiếm -->
                        <div id="searchResults" ></div>
                        <input id="typeOfCriteria_isEvent" name="typeOfCriteria_isEvent" hidden="hidden" th:value="${typeOfCriterion.isEvent()}">

                        <!-- Danh sách khách mời -->
                        <label th:if="${typeOfCriterion.isEvent()==true}" for="guestList">Danh sách khách mời:</label>
                        <ul th:if="${typeOfCriterion.isEvent()==true}" id="guestList" class="name-list" th:attr="data-eventId=${event.id}">
                            <th:block th:each="user : ${guestUsers}">
                                <li class="guest-item" th:attr="data-id=${user.id}">
                                    <span th:text="${user.name}"></span>
                                    <button class="btn-remove" type="button" onclick="removeUserThymeleaf(this, 'guest')">Xoá</button>
                                </li>
                            </th:block>
                        </ul>

                        <!-- Danh sách thành viên -->
                        <label for="memberList">Danh sách thành viên:</label>
                        <ul id="memberList" class="name-list" th:attr="data-eventId=${event.id}">
                            <th:block th:each="user : ${memberUsers}">
                                <li class="member-item" th:attr="data-id=${user.id}">
                                    <span th:text="${user.name}"></span>
                                    <button class="btn-remove" type="button" onclick="removeUserThymeleaf(this, 'member')">Xoá</button>
                                </li>
                            </th:block>
                        </ul>
                        <br>

                        <!-- Input ẩn để submit ID -->
                        <!-- Danh sách tên người dùng -->
                        <input type="hidden" id="guestNamesInput" name="guestNames" />
                        <input type="hidden" id="memberNamesInput" name="memberNames" />

                        <!-- Danh sách ID người dùng -->
                        <input type="hidden" id="guestIdsInput" name="guestIds" th:value="${guestIdsString}" />
                        <input type="hidden" id="memberIdsInput" name="memberIds" th:value="${memberIdsString}" />

                        <!--                         end search -->
                    </div>
                    <div class="col-4">
                        <label>Thời gian diễn ra : <input type="text" class="autoWidthInput" name="dateOfEvent" th:field="*{event.dateOfEvent}" required></label>
                        <br>
                        <label>Trạng thái sự kiện :
                            <input readonly th:field="*{event.status}" name="status">
                        </label>
                    </div>
                <!-- conference -->
                <div class="col-12" th:if="${conferences != null}">
                    <input value="conference" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{conference.id}" hidden="hidden">
                    <label>Tên bài tham luận: <input class="autoWidthInput" type="text" name="paperTitle" th:field="*{conference.paperTitle}" required></label><br>
                    <label>Quyết định tổ chức hội thảo: <input class="autoWidthInput" type="text" name="organizerDecision" th:field="*{conference.organizerDecision}" required></label><br>
                    <input class="autoWidthInput" th:field="*{conference.minutesOfMeeting}"  hidden="hidden">
                    <label >Biên bản cuộc họp:
                        <input  type="text" class="autoWidthInput" th:value="${conferences.minutesOfMeeting}" disabled>
                    </label><br>
                    <label style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label><br>
                    <input class="autoWidthInput" th:field="*{conference.presentationFiles}"  hidden="hidden">
                    <label >File trình bày:
                        <input type="text" class="autoWidthInput" th:value="${conferences.presentationFiles}" disabled>
                    </label><br>
                    <label style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>
                    <label>link đăng bài: <input class="autoWidthInput" type="text" name="articleLink" th:field="*{conference.articleLink}" required></label><br>

                    <label>Ảnh cũ:
                        <img id="oldImage" th:src="@{'/images/' + ${conferences.getImage()}}" alt="Ảnh conference" style="max-height: 150px;">
                    </label>
                    <br>
                    <label>Chọn ảnh mới:
                        <input type="file" id="newImageInput" name="imageEvent" accept="image/*">
                    </label>
                    <br>
                    <label>Ảnh mới (xem trước):
                        <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                    </label>
                    <input th:field="*{conference.idEvent}" hidden="hidden">
                </div>
                <!-- active in the council -->
                <div class="col-12" th:if="${activeInCouncil != null}">
                    <input value="activeInCouncil" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{activeInCouncil.id}" hidden="hidden">
                    <label>Nội dung trình bày :
                        <input class="autoWidthInput" type="text" name="content"
                               th:value="*{activeInCouncil.content}" required>
                    </label><br>
                    <label>Người trình bày :
                        <input class="autoWidthInput" type="text" name="presenter"
                               th:value="*{activeInCouncil.presenter}" required>
                    </label><br>
                    <input class="autoWidthInput" th:field="*{activeInCouncil.minutesOfMeeting}"  hidden="hidden">
                    <label >Biên bản cuộc họp:
                        <input  type="text" class="autoWidthInput" th:value="${activeInCouncil.minutesOfMeeting}" disabled>
                    </label><br>
                    <label style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label><br>
                    <input class="autoWidthInput" th:field="*{activeInCouncil.presentationFile}"  hidden="hidden">
                    <label >File trình bày:
                        <input type="text" class="autoWidthInput" th:value="${activeInCouncil.presentationFile}" disabled>
                    </label><br>
                    <label style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>
                    <label>Ảnh cũ:
                        <img id="oldImage" th:src="@{'/images/' + ${activeInCouncil.getImage()}}" alt="Ảnh conference" style="max-height: 150px;">
                    </label>
                    <br>
                    <label>Chọn ảnh mới:
                        <input type="file" id="newImageInput" name="imageEvent" accept="image/*">
                    </label>
                    <br>
                    <label>Ảnh mới (xem trước):
                        <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                    </label>
                    <input th:field="*{activeInCouncil.idEvent}" hidden="hidden">
                </div>

                <!-- approved research task -->
                <div class="col-12" th:if="${approvedResearchTask != null}">
                    <input value="approvedResearchTask" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{approvedResearchTask.id}" hidden="hidden">
                    <input th:field="*{approvedResearchTask.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label>Loại nhiệm vụ: <input class="autoWidthInput" name="taskType" th:field="*{approvedResearchTask.taskType}"></label><br>
                    <label>Thời gian bắt đầu làm: <input class="autoWidthInput" name="startTime" th:field="*{approvedResearchTask.startTime}"></label><br>
                    <label>Thời gian kết thúc: <input class="autoWidthInput" name="endTime" th:field="*{approvedResearchTask.endTime}"></label><br>
                    <label>Trạng thái:</label>
                    <label>
                        <input type="radio"
                               th:field="*{approvedResearchTask.status}"
                               value="1"
                               th:checked="${approvedResearchTask.status ==1}">
                         Đang thực hiện
                    </label>
                    <label>
                        <input type="radio"
                               th:field="*{approvedResearchTask.status}"
                               value="2"
                               th:checked="${approvedResearchTask.status ==2}">
                         Đã thực hiện
                    </label><br>
                    <label>Kết quả:</label>
                    <label>
                        <input type="radio" th:field="*{approvedResearchTask.result}" value="2" th:checked="${approvedResearchTask.result==2}"> Tốt
                    </label>
                    <label>
                        <input type="radio" th:field="*{approvedResearchTask.result}" value="3" th:checked="${approvedResearchTask.result==3}"> Khá
                    </label>
                    <label>
                        <input type="radio" th:field="*{approvedResearchTask.result}" value="4" th:checked="${approvedResearchTask.result==4}"> Không đạt
                    </label>
                    <label>
                        <input type="radio" th:field="*{approvedResearchTask.result}" value="5" th:checked="${approvedResearchTask.result==5}"> Gia hạn
                    </label>
                    <label>
                        <input type="radio" th:field="*{approvedResearchTask.result}" value="1" th:checked="${approvedResearchTask.result==1}"> Chưa có kết quả
                    </label>
                    <label style="color: orangered" hidden="hidden">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label style="color: orangered" hidden="hidden">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                </div>

                <!-- conference paper -->
                <div class="col-12" th:if="${conferencePaper != null}">
                    <input value="conferencePaper" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{conferencePaper.id}" hidden="hidden">
                    <input th:field="*{conferencePaper.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden">Biên bản cuộc họp:
                        <input  type="file" class="autoWidthInput" name="minutesOfMeeting">
                    </label>
                    <input class="autoWidthInput" th:field="*{conferencePaper.conferenceProceedingsFile}"  hidden="hidden">
                    <label>Tên bài tham luận :
                        <input class="autoWidthInput" th:field="*{conferencePaper.conferenceName}">
                    </label>
                    <br>
                    <label >File trình bày:
                        <input  class="autoWidthInput" th:value="${conferencePaper.conferenceProceedingsFile}" disabled>
                    </label><br>
                    <label style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>

                </div>

                <!-- expert presentation -->
                <div class="col-12" th:if="${expertPresentation != null}">
                    <input value="expertPresentation" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{expertPresentation.id}" hidden="hidden">
                    <input th:field="*{expertPresentation.idEvent}" hidden="hidden">
                    <label >Biên bản cuộc họp:
                        <input  type="text" class="autoWidthInput" th:value="${expertPresentation.minutesOfMeeting}" disabled>
                    </label><br>
                    <label style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label><br>
                    <label >File trình bày:
                        <input type="text" class="autoWidthInput" th:value="${expertPresentation.presentationFile}" disabled>
                    </label><br>
                    <label style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>
                    <label>Người trình bày : <input class="autoWidthInput" name="articleLink" th:field="*{expertPresentation.presenter}"></label><br>
                    <label>Ảnh seminar cũ:
                        <img id="oldImage" th:src="@{'/images/' + ${expertPresentation.getSeminarPhoto()}}" alt="Ảnh seminar" style="max-height: 150px;">
                    </label>
                    <br>
                    <label>Chọn ảnh mới:
                        <input type="file" id="newImageInput" name="imageEvent" accept="image/*">
                    </label>
                    <br>

                    <label>Ảnh mới (xem trước):
                        <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                    </label>
                </div>

                <!-- international paper -->
                <div class="col-12" th:if="${internationalPaper != null}">
                    <input value="internationalPaper" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{internationalPaper.id}" hidden="hidden">
                    <input th:field="*{internationalPaper.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label>Người đại diện: <input type="text" name="mainAuthor" th:field="*{internationalPaper.mainAuthor}"></label><br>
                    <label>Trạng thái :</label>
                    <label>
                        <input type="radio" th:field="*{internationalPaper.status}" value="1" th:checked="${internationalPaper.status==1}"> Đã gửi
                    </label>
                    <label>
                        <input type="radio" th:field="*{internationalPaper.status}" value="2" th:checked="${internationalPaper.status==2}"> Chấp nhận đăng
                    </label>
                    <label>
                        <input type="radio" th:field="*{internationalPaper.status}" value="3" th:checked="${internationalPaper.status==3}"> Đang phản biện
                    </label>
                    <br>
                    <label>link đăng bài: <input class="autoWidthInput" type="text" name="articleLink" th:field="*{internationalPaper.articleLink}" required></label><br>
                </div>

                <!-- ministry task -->
                <div class="col-12" th:if="${ministryTask != null}">
                    <input value="ministryTask" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{ministryTask.id}" hidden="hidden">
                    <input th:field="*{ministryTask.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                </div>

                <!-- overview paper -->
                <div class="col-12" th:if="${overviewPaper != null}">
                    <input value="overviewPaper" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{overviewPaper.id}" hidden="hidden">
                    <input th:field="*{overviewPaper.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label>link đăng bài: <input type="text" name="articleLink" th:field="*{overviewPaper.articleLink}"></label>

                </div>

                <!-- research advisory council -->
                <div class="col-12" th:if="${advisoryCouncil != null}">
                    <input value="researchAdvisoryCouncil" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{researchAdvisoryCouncil.id}" hidden="hidden">
                    <input th:field="*{researchAdvisoryCouncil.idEvent}" hidden="hidden">
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label >File thuyết minh:
                        <input type="text" class="autoWidthInput" th:value="${advisoryCouncil.documentTemplate}" disabled>
                    </label><br>
                    <label style="color: orangered">File thuyết minh mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>
                    <label>
                        Mô tả nhiệm vụ:
                        <textarea style="max-width: 1000px"  class="autoWidthInput" name="taskDescription" th:field="*{researchAdvisoryCouncil.taskDescription}"></textarea>
                    </label>
                    <br>
                    <label>Ảnh cũ:
                        <img id="oldImage" th:src="@{'/images/' + ${advisoryCouncil.getImage()}}" alt="Ảnh seminar" style="max-height: 150px;">
                    </label>
                    <br>
                    <label>Chọn ảnh mới:
                        <input type="file" id="newImageInput" name="imageEvent" accept="image/*">
                    </label>
                    <br>
                    <label>Ảnh mới (xem trước):
                        <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                    </label>
                </div>

                <!-- research proposal -->
                <div class="col-12" th:if="${researchProposal != null}">
                    <input value="researchProposal" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{researchProposal.id}" hidden="hidden">
                    <input th:field="*{researchProposal.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label>Loại hình đề xuất: <input type="text" name="proposalType" th:field="*{researchProposal.proposalType}"></label>
                </div>

                <!-- student research guidance -->
                <div class="col-12" th:if="${studentResearchGuidance != null}">
                    <input value="studentResearchGuidance" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{studentResearchGuidance.id}" hidden="hidden">
                    <input th:field="*{studentResearchGuidance.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label>Người hướng dẫn: <input type="text" class="autoWidthInput" name="mainAuthor" th:field="*{studentResearchGuidance.supervisorName}"></label><br>
                    <label>Thời gian bắt đầu:  <input type="text" class="autoWidthInput" name="articleLink" th:field="*{studentResearchGuidance.startTime}"></label>
                    <label>Thời gian kết thúc:  <input type="text" class="autoWidthInput" name="articleLink" th:field="*{studentResearchGuidance.endTime}"></label>
                    <label>Trạng thái :</label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.status}" value="1" th:checked="${studentResearchGuidance.status==1}"> Đang thực hiện
                    </label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.status}" value="2" th:checked="${studentResearchGuidance.status==2}"> Đã nghiệm thu
                    </label>
                    <br>
                    <label>Kết quả :</label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.result}" value="1" th:checked="${studentResearchGuidance.result==1}"> Tốt
                    </label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.result}" value="2" th:checked="${studentResearchGuidance.result==2}"> Khá
                    </label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.result}" value="3" th:checked="${studentResearchGuidance.result==3}"> Không đạt
                    </label>
                    <label>
                        <input type="radio" th:field="*{studentResearchGuidance.result}" value="4" th:checked="${studentResearchGuidance.result==4}"> Cần gia hạn
                    </label>

                </div>
                <!-- seminar -->
                <div class="col-12" th:if="${seminar != null}">
                    <input value="seminar" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{seminar.id}" hidden="hidden">
                    <input th:field="*{seminar.idEvent}" hidden="hidden">
                    <label>Người đại diện: <input type="text" class="autoWidthInput" name="mainAuthor" th:field="*{seminar.mainAuthor}"></label><br>
                    <label>link đăng bài: <input type="text" class="autoWidthInput" name="articleLink" th:field="*{seminar.articleLink}"></label><br>
                    <label >Biên bản cuộc họp:
                        <input  type="text" class="autoWidthInput" th:value="${seminar.minutesOfMeeting}" disabled>
                    </label><br>
                    <label style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label><br>
                    <label >File trình bày:
                        <input type="text" class="autoWidthInput" th:value="${seminar.presentationFile}" disabled>
                    </label><br>
                    <label style="color: orangered">File trình bày mới:
                        <input type="file"  name="presentationFiles" >
                    </label><br>
                    <label>Ảnh seminar cũ:
                        <img id="oldImage" th:src="@{'/images/' + ${seminar.getSeminarPhoto()}}" alt="Ảnh seminar" style="max-height: 150px;">
                    </label>
                    <br>
                    <label>Chọn ảnh mới:
                        <input type="file" id="newImageInput" name="imageEvent" accept="image/*">
                    </label>
                    <br>
                    <label>Ảnh mới (xem trước):
                        <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                    </label>
                </div>

                <!-- vietnamese paper -->
                <div class="col-12" th:if="${vietnamPaper != null}">
                    <input value="vietnamesePaper" name="nameAllEventDto" hidden="hidden">
                    <input th:field="*{vietnamesePaper.id}" hidden="hidden">
                    <input th:field="*{vietnamesePaper.idEvent}" hidden="hidden">
                    <label hidden="hidden">Chọn ảnh mới:
                        <input type="file"  name="imageEvent" accept="image/*">
                    </label>
                    <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                        <input  type="file" name="minutesOfMeeting" >
                    </label>
                    <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                        <input type="file"  name="presentationFiles" >
                    </label>
                    <label>Người đại diện: <input type="text" class="autoWidthInput" name="mainAuthor" th:field="*{vietnamesePaper.mainAuthor}"></label><br>
                    <label>link đăng bài: <input type="text" class="autoWidthInput" name="articleLink" th:field="*{vietnamesePaper.articleLink}"></label><br>
                    <label>Trạng thái :</label>
                    <label>
                        <input type="radio" th:field="*{vietnamesePaper.status}" value="1" th:checked="${vietnamPaper.status==1}"> Đã gửi
                    </label>
                    <label>
                        <input type="radio" th:field="*{vietnamesePaper.status}" value="2" th:checked="${vietnamPaper.status==2}"> Đang phản biện
                    </label>
                    <label>
                        <input type="radio" th:field="*{vietnamesePaper.status}" value="3" th:checked="${vietnamPaper.status==3}"> Chấp nhận đăng
                    </label>

                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                        Lưu
                    </button>
                </div>
            </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
