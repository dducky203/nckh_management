<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="margin-left: 11rem;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li th:each="item, stat : ${breadcrumbs}"
                    th:classappend="${stat.last} ? 'breadcrumb-item active' : 'breadcrumb-item'">
                    <a style="text-decoration: none" th:if="${!stat.last}" th:href="@{${item.url}}" th:text="${item.label}"></a>
                    <span th:if="${stat.last}" th:text="${item.label}"></span>
                </li>
            </ol>
        </nav>
    </div>
    <div style="position: fixed;top: 150px;left: 20px;">
        <a th:href="${'/'}" class="btn btn-primary" style="margin-bottom: 2rem">Quay lại</a>
        <br>
        <a class="btn btn-primary"
           th:href="@{'/event/showE/'+${session.saveUser.getId()}}"
           style="margin-bottom: 2rem">
            Xem sự kiện
        </a>
        <br>
        <a th:href="@{/createE/selectE}" class="btn btn-primary">Tạo sự kiện</a>
        <br>
        <br>
        <a th:href="@{/event/showEvManagement}" class="btn btn-primary" th:if="${session.saveUser.power != 3 && session.saveUser.power!= 4}">Duyệt sự kiện</a>
        <a th:href="@{/event/showEvManagement}"
           class="btn btn-primary"
           th:if="${session.saveNcm!=null && session.saveNcm.roleOfTeam==2}">
            Duyệt sự kiện
        </a>
    </div>
    <div class="container" >
        <h3 style="margin-left: 4rem" th:if="${ session.saveUser.power== 4}">Các sự kiện của bạn gần đây</h3>
        <h3 style="margin-left: 4rem" th:if="${session.saveUser.power != 3 && session.saveUser.power!= 4}">Các sự kiện gần đây</h3>
        <div class="row_content" th:each="e: ${events}">
            <div class="row" >
                <div class="col-10">
                    <h4 ><span th:text="${e.getEventName()}"></span>
                        <span th:if="${e.isDelete==2}" style="color: red" th:text="'(Đã xóa)'"></span>
                        <span th:if="${e.status==1}" style="color: red" th:text="'(Chưa duyệt)'"></span>
                    </h4>
                </div>
                <div class="col-2" th:text="${e.getCreateDate()}"></div>
                <div class="col-2" th:if="${e.getIdRoom() != null}">
                    <p >Địa điểm :<span th:text="${e.getIdRoom().roomName}"></span></p>
                </div>
                <div class="col-4">
                    <p>Thời gian diễn ra :<span th:text="${e.getDateOfEvent()}"></span></p>
                </div>
                <div class="col-4">
                    <a th:href="@{'/event/detailE/'+${e.getId()}}">xem thêm</a>
                </div>
            </div>

        </div>
    </div>
    <nav aria-label="Page navigation example" style="margin-left: 9.5rem" >
        <p >Bạn đang ở trang thứ <span th:text="${events.getNumber()+1}"></span></p>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link"
                   th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=1'}"
                   style="text-decoration: none">
                    Trang đầu
                </a>
            </li>
            <div th:if="${events.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
                <li class="page-item" style="border: var(--bs-pagination-border-width) solid var(--bs-pagination-border-color);padding: 6px">
                    <a th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=' + ${pageNumber}}"
                       th:text="${pageNumber}"
                       th:class="${pageNumber == events.number + 1} ? 'active'"
                       style="text-decoration: none" class="page-link">
                    </a>
                </li>
            </div>
            <li class="page-item">
                <a class="page-link"
                   th:if="${maxPageNumber !=null}"
                   style="text-decoration: none"
                   th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=' + ${maxPageNumber}}"
                >
                    Trang cuối
                </a>
            </li>
        </ul>
    </nav>
</section>

</body>
</html>
