<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Norm statistics</title>
    <style>
        .norm-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .norm-input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 120px;
        }

        .norm-btn {
            padding: 8px 16px;
            background-color: #007bff; /* xanh dương */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .norm-btn:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>
<div th:replace="user/header :: header"></div>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div class="container" th:if="${session.saveUser!=null}">
        <div style="position: fixed;top: 150px;left: 20px;">
            <a th:href="@{'/user'}" class="btn btn-primary" >Quay lại</a>
            <br><br>
        </div>
        <div class="row" >
            <form id="yearFilterForm" class="norm-form" th:action="@{'/ncm/normStatistics/' + ${session.saveUser.id}}" method="get">
                <input id="yearInput" class="norm-input" type="number" name="year" placeholder="Nhập năm" required />
                <button id="yearSubmitBtn" class="norm-btn" type="submit">Xem định mức</button>
            </form>
            <div style="height: 0.75rem"></div>
            <h3 th:text="'Tổng số giờ nghiên cứu bạn đạt được trong năm '+${year}+' :  '+${totalNorm_}"></h3>
            <h5 >Tổng định mức bạn cần đạt được : <span th:text="${totalNorm}"></span>
                <span style="color: greenyellow" th:if="${totalNorm_ >= totalNorm}"> ( Đã đạt )</span>
                <span style="color: red" th:if="${totalNorm_ < totalNorm}"> ( Không đạt )</span>
            </h5>
            <div class="container" >
                <h3 style="margin-left: 4rem" >Các sự kiện bạn tham gia trong năm <span th:text="${year}"></span></h3>
                <div class="row_content" th:each="e: ${events}">
                    <div class="row" >
<!--                        <p th:text="${}"></p>-->
                        <div class="col-10">
                            <h4 th:text="${e.getEventName()}"></h4>
                        </div>
                        <div class="col-2" th:text="${e.getCreateDate()}"></div>
                        <div class="col-2">
                            <p >Địa điểm :<span th:text="${e.getIdRoom().roomName}"></span></p>
                        </div>
                        <div class="col-4">
                            <p>Thời gian diễn ra :<span th:text="${e.getDateOfEvent()}"></span></p>
                        </div>
                        <div class="col-4">
                            <a th:href="@{'/event/detailE/'+${e.getId()}}">xem thêm</a>
                        </div>
                    </div>

                </div>
            </div>
            <nav aria-label="Page navigation example" style="margin-left: 1.5rem" >
                <p >Bạn đang ở trang thứ <span th:text="${events.getNumber()+1}"></span></p>
                <ul class="pagination">
                    <li class="page-item">
                        <a class="page-link"
                           th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=1'}"
                           style="text-decoration: none">
                            Trang đầu
                        </a>
                    </li>
                    <div th:if="${events.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
                        <li class="page-item" style="border: var(--bs-pagination-border-width) solid var(--bs-pagination-border-color);padding: 6px">
                            <a th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=' + ${pageNumber}}"
                               th:text="${pageNumber}"
                               th:class="${pageNumber == events.number + 1} ? 'active'"
                               style="text-decoration: none" class="page-link">
                            </a>
                        </li>
                    </div>
                    <li class="page-item">
                        <a class="page-link"
                           th:if="${maxPageNumber !=null}"
                           style="text-decoration: none"
                           th:href="@{'/event/showE/' + ${session.saveUser.getId()} + '?size=' + ${events.size} + '&page=' + ${maxPageNumber}}"
                        >
                            Trang cuối
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>

</body>
</html>
