<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      >
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" type="text/css" />
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/assets/user/css/styles.css}" rel="stylesheet" />
    <style>
        /* Đảm bảo reset các padding/margin cơ bản */
        ul, li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* Bố cục dòng */
        .row {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        /* Tiêu đề loại tiêu chí */
        .col-12 h5 {
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
        }

        /* Danh sách dropdown mặc định ẩn */
        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            z-index: 1000;
            border-radius: 6px;
            padding: 10px 0;
        }

        /* Khi hover vào h5 thì hiện dropdown-menu */
        .col-12:hover .dropdown-menu {
            display: block;
        }

        /* Các mục trong dropdown */
        .dropdown-item {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            transition: background 0.3s;
        }

        .dropdown-item:hover {
            background-color: #f0f0f0;
            color: #000;
        }
        .criteria-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .criteria-item {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid #007bff;
            border-radius: 4px;
            text-decoration: none;
            color: #007bff;
            background-color: #f8f9fa;
            transition: background-color 0.2s;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .criteria-item:hover {
            background-color: #e2e6ea;
        }

        /* Nếu tiêu chí dài thì xuống dòng */
        .criteria-item.long-text {
            white-space: normal;
            flex: 1 1 100%;
        }


    </style>
</head>
<body>
<nav class="navbar navbar-light bg-light static-top">
    <div class="container">
        <img style="width: 5rem" class="navbar-brand" th:src="@{/images/logo_fita.png}" alt="img fita">
        <p th:if="${session.saveUser != null}"><a th:href="@{'/event/showE/'+${session.saveUser.getId()}}">Xem /tạo sự kiện của bạn</a></p>
        <p th:if="${session.saveUser != null}"><a th:href="@{'/user/resume/'+${session.saveUser.getId()}}">Hồ sơ</a></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p th:if="${session.saveUser != null}" style="align-content: center" th:text="'Xin chào '+${session.saveUser.getName()}"></p>
        <a th:if="${session.saveUser == null}" class="btn btn-primary" th:href="@{/login}">Đăng nhập</a>
        <a th:if="${session.saveUser != null}" class="btn btn-primary" th:href="@{/login/logout}" style="background-color: orangered">Đăng xuất</a>
    </div>
</nav>
<div class="container" >
    <div style="position: fixed;top: 150px;left: 20px;">
        <a th:href="@{'/event/showE/'+${session.saveUser.getId()}}" class="btn btn-primary" >Quay lại</a>
    </div>
    <h3>Chọn loại sự kiện/hoạt động NCKH muốn tạo :</h3>
    <div class="row">
        <h4>Các sự kiện</h4>
        <!--/*@thymesVar id="EventTypes" type=""*/-->
        <div class="col-12 mb-4" th:each="type : ${eventTypes}">
            <!-- Tên loại tiêu chí -->
            <h5 class="mb-2" th:text="${type.getName()}"></h5>
            <!-- Danh sách tiêu chí con -->
            <div class="criteria-wrapper">
                <div th:each="op : ${operatingStandards2}" th:if="${op.getIdTypeOfCriteria().id == type.getId()&&op.id!=2&&op.id!=6}">
                    <a class="criteria-item"
                       th:classappend="${#strings.length(op.name) > 25} ? ' long-text' : ''"
                       th:href="@{'/createE/informationEvent/'+${type.getId()}+'/' + ${op.getId()}}"
                       th:text="${op.name}">
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <h4>Các Hoạt động NCKH</h4>
        <!--/*@thymesVar id="nonEventTypes" type=""*/-->
        <div class="col-12 mb-4" th:each="type : ${nonEventTypes}">
            <!-- Tên loại tiêu chí -->
            <h5 class="mb-2" th:text="${type.getName()}"></h5>
            <!-- Danh sách tiêu chí con -->
            <div class="criteria-wrapper">
                <div th:each="op : ${operatingStandards2}" th:if="${op.getIdTypeOfCriteria().id == type.getId()}">
                    <a class="criteria-item"
                       th:classappend="${#strings.length(op.name) > 25} ? ' long-text' : ''"
                       th:href="@{'/createE/informationEvent/'+${type.getId()}+'/' + ${op.getId()}}"
                       th:text="${op.name}">
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
