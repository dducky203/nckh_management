<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .form-floating-placeholder {
            position: relative;
        }

        .form-floating-placeholder input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            background-color: transparent;
            position: relative;
            z-index: 2;
        }

        .form-floating-placeholder label {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #666;
            font-size: 16px;
            background-color: white;
            padding: 0 4px;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 3;
        }

        .form-floating-placeholder input:focus + label,
        .form-floating-placeholder input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 12px;
            color: #333;
        }

        .placeholder-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 16px;
            color: #bbb;
            pointer-events: none;
            z-index: 1;
            font-family: inherit;
            white-space: pre;
        }
    </style>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{/createE/selectE}" class="btn btn-primary" >Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <form id="eventForm"  th:action="@{'/createE/saveE/'+${session.operatingStandardId2}}" enctype="multipart/form-data" th:object="${allEventDto}" method="post">
                <div class="row">
                    <div class="col-8">
                        <p th:text="${message}" style="color: red"></p>
                        <input name="id" th:field="*{event.id}" hidden="hidden">
                        <label>Tên sự kiện : <input class="autoWidthInput"  name="nameEvent" th:field="*{event.eventName}" required></label><br>
                        <input class="autoWidthInput" th:field="*{event.creator}" th:value="${session.saveUser.getId()}" name="creator" hidden="hidden">
                        <label>Người tạo sự kiện : <input class="autoWidthInput" th:value="${session.saveUser.getName()}" disabled></label><br>
                        <input th:field="*{event.createDate}" hidden="hidden">
                        <div th:if="${idTypeOfCriteria != 4 && idTypeOfCriteria!=3}">
                            <label>Tiết bắt đầu : <input required type="number" class="autoWidthInput" name="startTime" th:field="*{event.startTime}"> -- tiết kết thúc : <input required type="number" class="autoWidthInput" name="endTime" th:field="*{event.endTime}"></label><br>
                            <!-- Link để hiển thị danh sách phòng -->
                            <label style="color: orangered">
                                Chọn phòng tổ chức sự kiện mới :
                                <a href="#" onclick="toggleRoomList()">Chọn</a>
                            </label><br>
                            <!-- Danh sách các phòng -->
                            <div id="roomList" style="display: none; margin: 10px;overflow: auto;height: 300px;border: black solid 1px;border-radius: 10px">
                                <ul>
                                    <li th:each="room : ${rooms}">
                                        <label>
                                            <input type="radio" name="idRoom"
                                                   th:value="${room.id}"
                                                   th:field="*{event.idRoom}"
                                                   th:checked="${room.getId() == 1}"
                                            />
                                            <span th:text="${room.roomName} + ' - ' + ${room.address}"></span>
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <input th:field="*{event.idOperatingStandard2}" hidden="hidden">
<!--                        <div th:each="room :${rooms}">-->
<!--                            <p th:if="${event.getIdRoom() == room.getId()}" th:text="'Phòng diễn ra hiện tại: '+${room.getRoomName()}+' &#45;&#45; địa chỉ: '+${room.getAddress()}"></p>-->
<!--                        </div>-->

                        <!--                        search-->
                        <div>
                            <label>Tìm người dùng:</label>
                            <input type="text" id="searchInput" placeholder="Nhập tên...">
                            <button type="button" onclick="searchUsers()">Tìm</button>
                        </div>

                        <!-- Hiển thị kết quả tìm kiếm -->
                        <div id="searchResults" ></div>

<!--                        idTypeOfCriteria -->
                        <input id="typeOfCriteria_isEvent" name="typeOfCriteria_isEvent" hidden="hidden" th:value="${typeOfCriteria.isEvent()}">

                        <!-- Danh sách khách mời -->
                        <label for="guestList" >Danh sách khách mời:</label>
                        <p style="color: red" th:if="${typeOfCriteria.isEvent() == false}">Không có khách mời tham dự </p>

                        <ul th:if="${typeOfCriteria.isEvent() == true}" id="guestList" class="name-list" >
                            <th:block th:each="user : ${guestUsers}">
                                <li class="guest-item" th:attr="data-id=${user.id}">
                                    <span th:text="${user.name}"></span>
                                    <button class="btn-remove" type="button" onclick="removeUserThymeleaf(this, 'guest')">Xoá</button>
                                </li>
                            </th:block>
                        </ul>
                        <!-- Danh sách thành viên -->
                        <label for="memberList">Danh sách thành viên:</label>
                        <ul id="memberList" class="name-list" >
                            <th:block th:each="user : ${memberUsers}">
                                <li class="member-item" th:attr="data-id=${user.id}">
                                    <span th:text="${user.name}"></span>
                                    <button class="btn-remove" type="button" onclick="removeUserThymeleaf(this, 'member')">Xoá</button>
                                </li>
                            </th:block>
                        </ul>
                        <br>

                        <!-- Input ẩn để submit ID -->
                        <!-- Danh sách tên người dùng -->
                        <input type="hidden" id="guestNamesInput" name="guestNames" />
                        <input type="hidden" id="memberNamesInput" name="memberNames" />

                        <!-- Danh sách ID người dùng -->
                        <input type="hidden" id="guestIdsInput" name="guestIds" />
                        <input type="hidden" id="memberIdsInput" name="memberIds" />

                        <!--                         end search -->
                    </div>
                    <div class="col-4">
                        <div class="form-floating-placeholder">
                            <input name="dateOfEvent" th:field="*{event.dateOfEvent}" type="text" id="dob" maxlength="10" placeholder=" " required />
                            <label for="dob">Thời gian diễn ra</label>
                            <div class="placeholder-overlay" id="placeholder">DD/MM/YYYY</div>
                        </div>
                        <script th:src="@{/assets/user/js/createEvent.js}"></script>
                    </div>
<!--                    test -->
                    <p th:text="${currentType}"></p>
<!--                    end test-->

                    <!-- conference -->
                    <div class="col-12" th:if="${currentType == 'conferences'}">
                        <input value="conference" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{conference.id}" hidden="hidden">
<!--                        <label hidden="hidden">Chọn ảnh mới:-->
<!--                            <input type="file"  name="imageEvent" accept="image/*">-->
<!--                        </label>-->
                        <label>Tên bài tham luận: <input  class="autoWidthInput" type="text" name="paperTitle" th:field="*{conference.paperTitle}" required></label><br>
                        <label>Quyết định tổ chức hội thảo: <input class="autoWidthInput" type="text" name="organizerDecision" th:field="*{conference.organizerDecision}" required></label><br>
                        <input class="autoWidthInput" th:field="*{conference.minutesOfMeeting}"  hidden="hidden">

                        <label style="color: orangered">Biên bản cuộc họp mới:
                            <input required type="file" name="minutesOfMeeting" >
                        </label><br>
                        <input class="autoWidthInput" th:field="*{conference.presentationFiles}"  hidden="hidden">

                        <label style="color: orangered">File trình bày mới:
                            <input type="file" required  name="presentationFiles" >
                        </label><br>
                        <label>link đăng bài: <input  class="autoWidthInput" type="text" name="articleLink" th:field="*{conference.articleLink}" required></label><br>
                        <label>Chọn ảnh mới:
                            <input type="file" required id="newImageInput" name="imageEvent" accept="image/*">
                        </label>
                        <br>
                        <label>Ảnh mới (xem trước):
                            <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                        </label>
                        <input th:field="*{conference.idEvent}" hidden="hidden">
                    </div>
                    <!-- active in the council -->
                    <div class="col-12" th:if="${currentType == 'activeInCouncil'}">
                        <input value="activeInCouncil" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{activeInCouncil.id}" hidden="hidden">
                        <label>Nội dung trình bày :

                        </label><br>

                        </label><br>

                        <label style="color: orangered">Biên bản cuộc họp mới:

                        </label><br>

                        <label style="color: orangered">File trình bày mới:
                            <input type="file" required  name="presentationFiles" >
                        </label><br>
                        <label>Chọn ảnh mới:

                        <br>
                        <label>Ảnh mới (xem trước):

                        </label>
                        <input th:field="*{activeInCouncil.idEvent}" hidden="hidden">
                    </div>

                    <!-- approved research task -->

                        <input value="approvedResearchTask" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{approvedResearchTask.id}" hidden="hidden">
                        <input th:field="*{approvedResearchTask.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:

                        <label>Loại nhiệm vụ: <input required class="autoWidthInput" name="taskType" th:field="*{approvedResearchTask.taskType}"></label><br>

                        <label>
                            <input type="radio" th:field="*{approvedResearchTask.result}" value="3" disabled> Khá
                        </label>
                        <label>
                            <input type="radio" th:field="*{approvedResearchTask.result}" value="4" disabled> Không đạt
                        </label>
                        <label>
                            <input type="radio" th:field="*{approvedResearchTask.result}" value="5" disabled> Gia hạn
                        </label>
                        <label>
                            <input type="radio" th:field="*{approvedResearchTask.result}" value="1" checked> Chưa có kết quả

                        <label style="color: orangered" hidden="hidden">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label style="color: orangered" hidden="hidden">File trình bày mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                    </div>

                    <!-- conference paper -->
                    <div class="col-12" th:if="${currentType == 'conferencePaper'}">
                        <input value="conferencePaper" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{conferencePaper.id}" hidden="hidden">
                        <input th:field="*{conferencePaper.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:

                        </label>
                        <label hidden="hidden">Biên bản cuộc họp:

                        </label>
                        <input  class="autoWidthInput" th:field="*{conferencePaper.conferenceProceedingsFile}"  hidden="hidden">

                        <label>Tên bài tham luận :
                            <input class="autoWidthInput" th:field="*{conferencePaper.conferenceName}">
                        </label>
                        <br>
                        <label style="color: orangered">File trình bày mới:
                            <input type="file" required  name="presentationFiles" >
                        </label><br>

                    </div>

                    <!-- expert presentation -->
                    <div class="col-12" th:if="${currentType == 'expertPresentation'}">
                        <input value="expertPresentation" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{expertPresentation.id}" hidden="hidden">
                        <input th:field="*{expertPresentation.idEvent}" hidden="hidden">

                        <label style="color: orangered">Biên bản cuộc họp mới:
                            <input required type="file" name="minutesOfMeeting" >
                        </label><br>

                        <label style="color: orangered">File trình bày mới:
                            <input type="file" required name="presentationFiles" >
                        </label><br>
                        <label>Người trình bày : <input required class="autoWidthInput" name="articleLink" th:field="*{expertPresentation.presenter}"></label><br>

                        <label>Chọn ảnh mới:
                            <input type="file" required id="newImageInput" name="imageEvent" accept="image/*">
                        </label>
                        <br>

                        <label>Ảnh mới (xem trước):
                            <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                        </label>
                    </div>

                    <!-- international paper -->
                    <div class="col-12" th:if="${currentType == 'internationalPaper'}">
                        <input value="internationalPaper" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{internationalPaper.id}" hidden="hidden">
                        <input th:field="*{internationalPaper.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"  name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">File trình bày mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label>Người đại diện: <input required type="text" name="mainAuthor" th:field="*{internationalPaper.mainAuthor}"></label><br>
                        <label>Trạng thái :</label>
                        <label>
                            <input type="radio" th:field="*{internationalPaper.status}" value="1" disabled> Đã gửi
                        </label>
                        <label>
                            <input type="radio" th:field="*{internationalPaper.status}" value="2" disabled> Chấp nhận đăng
                        </label>
                        <label>
                            <input type="radio" th:field="*{internationalPaper.status}" value="3" disabled checked> Đang phản biện
                        </label>
                        <br>
                        <label>link đăng bài: <input class="autoWidthInput" type="text" name="articleLink" th:field="*{internationalPaper.articleLink}" required></label><br>
                    </div>

                    <!-- ministry task -->
                    <div class="col-12" th:if="${currentType == 'ministryTask'}">
                        <input value="ministryTask" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{ministryTask.id}" hidden="hidden">
                        <input th:field="*{ministryTask.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"  name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">File trình bày mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <!-- Chọn Trưởng nhóm và Thư ký -->
                        <div id="roleSelection" style="margin-top: 20px;">
                            <label for="leaderSelect">Chọn Trưởng nhóm:</label>
                            <select id="leaderSelect" name="taskLead" th:field="*{ministryTask.taskLead}">
                                <option value="">-- Chọn --</option>
                            </select>

                            <div  th:if="${operatingStandardId2==27 || operatingStandardId2==28}">
                                <label for="secretarySelect" >Chọn Thư ký:</label>
                                <select id="secretarySelect" name="secretary" th:field="*{ministryTask.secretary}">
                                    <option value="">-- Chọn --</option>
                                </select>
                            </div>

                        </div>

                    </div>

                    <!-- overview paper -->
                    <div class="col-12" th:if="${currentType == 'overviewPaper'}">
                        <input value="overviewPaper" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{overviewPaper.id}" hidden="hidden">
                        <input th:field="*{overviewPaper.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"  name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">File trình bày mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label>link đăng bài: <input required type="text" name="articleLink" th:field="*{overviewPaper.articleLink}"></label>

                    </div>

                    <!-- research advisory council -->
                    <div class="col-12" th:if="${currentType == 'advisoryCouncil'}">
                        <input value="researchAdvisoryCouncil" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{researchAdvisoryCouncil.id}" hidden="hidden">
                        <input th:field="*{researchAdvisoryCouncil.idEvent}" hidden="hidden">
<!--                        <label hidden="hidden">Chọn ảnh mới:-->
<!--                            <input type="file"  name="imageEvent" accept="image/*">-->
<!--                        </label>-->
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>

                        <label style="color: orangered">File thuyết minh:

                        </label>
                        <br>
                        <label>Ảnh mới (xem trước):
                            <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                        </label>
                        <br>
                        <label>
                            Mô tả nhiệm vụ:
                            <textarea style="max-width: 750px"  class="autoWidthInput" name="taskDescription" th:field="*{researchAdvisoryCouncil.taskDescription}" required></textarea>
                        </label>
                    </div>

                    <!-- research proposal -->
                    <div class="col-12" th:if="${currentType == 'researchProposal'}">
<!--                        <p>researchProposal</p>-->
                        <input value="researchProposal" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{researchProposal.id}" hidden="hidden">
                        <input th:field="*{researchProposal.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"  name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label>Loại hình đề xuất: <input required type="text" name="proposalType" th:field="*{researchProposal.proposalType}"></label>
                    </div>

                    <div class="col-12" th:if="${currentType=='studentResearchGuidance'}">
                        <input value="studentResearchGuidance" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{studentResearchGuidance.id}" hidden="hidden">
                        <input th:field="*{studentResearchGuidance.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"   name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label>Người hướng dẫn: <input required type="text" class="autoWidthInput" name="mainAuthor" th:field="*{studentResearchGuidance.supervisorName}"></label><br>
                        <label>Thời gian bắt đầu:  <input required type="text" class="autoWidthInput" name="articleLink" th:field="*{studentResearchGuidance.startTime}"></label>
                        <label>Thời gian kết thúc:  <input required type="text" class="autoWidthInput" name="articleLink" th:field="*{studentResearchGuidance.endTime}"></label>
                        <br>
                        <label>Trạng thái :</label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.status}" value="1" disabled> Đang thực hiện
                        </label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.status}" value="2" checked disabled> Đã nghiệm thu
                        </label>
                        <br>
                        <label>Kết quả :</label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.result}" value="1" disabled> Tốt
                        </label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.result}" value="2" disabled> Khá
                        </label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.result}" value="3" disabled> Không đạt
                        </label>
                        <label>
                            <input type="radio" th:field="*{studentResearchGuidance.result}" value="4" disabled> Cần gia hạn
                        </label>

                    </div>

                    <!-- seminar -->
                    <div class="col-12" th:if="${currentType == 'seminar'}">
                        <input value="seminar" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{seminar.id}" hidden="hidden">
                        <input th:field="*{seminar.idEvent}" hidden="hidden">
                        <label>Người đại diện: <input required type="text" class="autoWidthInput" name="mainAuthor" th:field="*{seminar.mainAuthor}"></label><br>
                        <label>link đăng bài: <input required type="text" class="autoWidthInput" name="articleLink" th:field="*{seminar.articleLink}"></label><br>

                        <label style="color: orangered">Biên bản cuộc họp mới:
                            <input required type="file" name="minutesOfMeeting" >
                        </label><br>

                        <label style="color: orangered">File trình bày mới:

                        </label><br>
                        <label>Chọn ảnh mới:
                            <input type="file" required id="newImageInput" name="imageEvent" accept="image/*">
                        </label>
                        <br>
                        <label>Ảnh mới (xem trước):
                            <img id="newImagePreview" src="#" alt="Ảnh mới sẽ hiển thị ở đây" style="max-height: 150px; display: none;">
                        </label>
                    </div>

                    <!-- vietnamese paper -->
                    <div class="col-12" th:if="${currentType == 'vietnamPaper'}">
                        <input value="vietnamesePaper" name="nameAllEventDto" hidden="hidden">
                        <input th:field="*{vietnamesePaper.id}" hidden="hidden">
                        <input th:field="*{vietnamesePaper.idEvent}" hidden="hidden">
                        <label hidden="hidden">Chọn ảnh mới:
                            <input type="file"  name="imageEvent" accept="image/*">
                        </label>
                        <label hidden="hidden" style="color: orangered">Biên bản cuộc họp mới:
                            <input  type="file" name="minutesOfMeeting" >
                        </label>
                        <label hidden="hidden" style="color: orangered">File thuyết minh mới:
                            <input type="file"  name="presentationFiles" >
                        </label>
                        <label>Người đại diện: <input required type="text" class="autoWidthInput" name="mainAuthor" th:field="*{vietnamesePaper.mainAuthor}"></label><br>
                        <label>link đăng bài: <input required type="text" class="autoWidthInput" name="articleLink" th:field="*{vietnamesePaper.articleLink}"></label><br>
                        <label>Trạng thái :</label>
                        <label>
                            <input type="radio" th:field="*{vietnamesePaper.status}" value="1" disabled > Đã gửi
                        </label>
                        <label>
                            <input type="radio" th:field="*{vietnamesePaper.status}" value="2" disabled> Đang phản biện
                        </label>
                        <label>
                            <input type="radio" th:field="*{vietnamesePaper.status}" value="3" disabled checked> Chấp nhận đăng
                        </label>

                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                            Lưu
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
