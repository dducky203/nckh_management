<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div style="position: fixed;top: 150px;left: 40px;">
        <a th:href="@{'/user/resume/'+${session.saveUser.getId()}}" class="btn btn-primary" style="background-color: #0d6efd">Quay lại</a>
    </div>
    <div class="container" >
        <div class="row_content">
            <div class="row">
                <form th:action="@{'/user/resume/savePass/'+${session.saveUser.getId()}}" method="post" enctype="multipart/form-data" >
                    <div class="col-3"></div>
                    <div class="col-6">
                        <h3>Thay mật khẩu</h3>
                        <label for="pass1">
                            <input type="password" id="pass1" name="pass1" placeholder="Nhập mật khẩu thứ 1 ...">
                        </label>
                        <br>
                        <label for="pass2">
                            <input type="password" id="pass2" name="pass2" placeholder="Nhập mật khẩu thứ 2 ...">
                        </label>
                        <br>
                        <input type="submit" class="btn btn-primary" style="background-color: #0dcaf0">
                    </div>
                    <div class="col-3"></div>
                </form>

            </div>
        </div>
    </div>
</section>


</body>
</html>
