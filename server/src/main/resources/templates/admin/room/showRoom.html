<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" type="text/css" />
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/user/css/styles.css}" rel="stylesheet" />
    <style>
        /* Đảm bảo reset các padding/margin cơ bản */
        ul, li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* Bố cục dòng */
        .row {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        /* Tiêu đề loại tiêu chí */
        .col-12 h5 {
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
        }

        /* Danh sách dropdown mặc định ẩn */
        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: #ffffff;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            z-index: 1000;
            border-radius: 6px;
            padding: 10px 0;
        }

        /* Khi hover vào h5 thì hiện dropdown-menu */
        .col-12:hover .dropdown-menu {
            display: block;
        }

        /* Các mục trong dropdown */
        .dropdown-item {
            display: block;
            padding: 10px 20px;
            color: #333;
            text-decoration: none;
            transition: background 0.3s;
        }

        .dropdown-item:hover {
            background-color: #f0f0f0;
            color: #000;
        }
        .criteria-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .criteria-item {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid #007bff;
            border-radius: 4px;
            text-decoration: none;
            color: #007bff;
            background-color: #f8f9fa;
            transition: background-color 0.2s;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .criteria-item:hover {
            background-color: #e2e6ea;
        }

        /* Nếu tiêu chí dài thì xuống dòng */
        .criteria-item.long-text {
            white-space: normal;
            flex: 1 1 100%;
        }


    </style>
</head>
<body>
<section class="showcase" style="margin-top: 3rem" layout:fragment="content">
    <div class="container" th:if="${session.saveAdmin!=null}">
        <h3>Danh sách các phòng :</h3>
        <div class="row" >
            <!-- power -->
            <div class="col-12 mb-4" th:each="u : ${rooms}">
                <!-- Danh sách tiêu chí con -->
                <div class="criteria-wrapper">
                    <div >
                        <h5 class="criteria-item">
                            <span class="criteria-item" style="border: 0" th:text="${u.roomName}+' - '+${u.address}+' '"></span>
                            <a class="criteria-item" th:href="@{'/ad/managerRoom/repairRoom/'+${u.id}}"> Sửa</a>
                        </h5>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
