<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div class="container" >
        <h3 style="margin-left: 4rem">Các sự kiện/hoạt động cần duyệt gần đây</h3>
        <div class="row_content" th:each="e: ${events}">
            <div class="row" >
                <div class="col-10">
                    <h4 th:text="${e.getEventName()}"></h4>
                </div>
                <div class="col-2" >
                    <p th:if="${e.getStatus()==1}" >
                        <span th:text="${e.getCreateDate()}"></span> <br>
                        (<span th:text="'Cần duyệt'" style="color: red"></span>)
                    </p>

                </div>
                <div class="col-2">
                    <p >Địa điểm :<span th:text="${e.getIdRoom().roomName}"></span></p>
                </div>
                <div class="col-4">
                    <p>Thời gian diễn ra :<span th:text="${e.getDateOfEvent()}"></span></p>
                </div>
                <div class="col-4">
                    <a th:href="@{'/ad/statistics/detailE/'+${e.getId()}}">xem thêm</a>
                </div>
            </div>

        </div>
    </div>
    <nav aria-label="Page navigation example" style="margin-left: 9.5rem" >
        <p >Bạn đang ở trang thứ <span th:text="${events.getNumber()+1}"></span></p>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link"
                   th:href="@{'/ad/event/showEvManagement' + '?size=' + ${events.size} + '&page=1'}"
                   style="text-decoration: none">
                    Trang đầu
                </a>
            </li>
            <div th:if="${events.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
                <li class="page-item" style="border: var(--bs-pagination-border-width) solid var(--bs-pagination-border-color);padding: 6px">
                    <a th:href="@{'/ad/event/showEvManagement' + '?size=' + ${events.size} + '&page=' + ${pageNumber}}"
                       th:text="${pageNumber}"
                       th:class="${pageNumber == events.number + 1} ? 'active'"
                       style="text-decoration: none" class="page-link">
                    </a>
                </li>
            </div>
            <li class="page-item">
                <a class="page-link"
                   th:if="${maxPageNumber !=null}"
                   style="text-decoration: none"
                   th:href="@{'/ad/event/showEvManagement' + '?size=' + ${events.size} + '&page=' + ${maxPageNumber}}"
                >
                    Trang cuối
                </a>
            </li>
        </ul>
    </nav>
</section>

</body>
</html>
