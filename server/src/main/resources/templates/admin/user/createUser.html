<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
  <meta charset="UTF-8">
  <title>Tạo mới người dùng</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <section class="showcase" style="align-content: center" layout:fragment="content">
    <div class="container mt-5">
      <h2 class="mb-4">Tạo mới người dùng</h2>
      <p style="color: red" th:text="${message}"></p>
      <form th:action="@{/ad/managerUser/createUser}" method="post">
        <!-- Thông tin bảng user -->
        <div class="form-group">
          <label for="name">Họ và tên</label>
          <input type="text" class="form-control" id="name" name="name" required maxlength="250">
        </div>
        <div class="form-group">
          <label for="username">Tài Khoản</label>
          <input type="text" class="form-control" id="username" name="username" required maxlength="250">
        </div>
<!--        <div class="form-group">-->
<!--          <label for="password">Mật khẩu</label>-->
<!--          <input type="password" class="form-control" id="password" name="password" required maxlength="250">-->
<!--        </div>-->
<!--        <div class="form-group">-->
<!--          <label for="id_role">Vai trò (id_role)</label>-->
<!--          <input type="number" class="form-control" id="id_role" name="id_role" required>-->
<!--        </div>-->
        <div class="form-group">
          <label for="power">Quyền hạn</label>
          <select class="form-control" id="power" name="power" onchange="toggleTitleField()">
            <option value="">-- Chọn quyền hạn --</option>
            <option value="1">Trưởng khoa</option>
            <option value="2">Phó khoa</option>
            <option value="3">Cán bộ khoa</option>
            <option value="4">Sinh viên</option>
          </select>
        </div>

        <div class="form-group" id="title-group" style="display: none;">
          <label for="id_title">Chức danh</label>
          <select class="form-control" id="id_title" name="id_title">
            <option value="">-- Chọn chức danh --</option>
            <option th:each="t : ${title}" th:value="${t.id}" th:text="${t.name}"></option>
          </select>
        </div>

        <script>
          function toggleTitleField() {
            const power = document.getElementById("power").value;
            const titleGroup = document.getElementById("title-group");

            if (power && parseInt(power) !== 4) {
              titleGroup.style.display = "block";
            } else {
              titleGroup.style.display = "none";
              document.getElementById("id_title").value = ""; // Clear selection
            }
          }
        </script>
        <hr>

        <!-- Thông tin bảng resume -->
        <h4>Thông tin sơ yếu lý lịch</h4>
<!--        <div class="form-group">-->
<!--          <label for="code">Mã người dùng (code)</label>-->
<!--          <input type="text" class="form-control" id="code" name="code" maxlength="250">-->
<!--        </div>-->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" maxlength="100">
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="text" class="form-control" id="phone" name="phone" maxlength="10">
        </div>
        <div class="form-group">
          <label for="address">Địa chỉ</label>
          <input type="text" class="form-control" id="address" name="address" maxlength="250">
        </div>
        <div class="form-group">
          <label for="birthday">Ngày sinh</label>
          <input type="date" class="form-control" id="birthday" name="birthday">
        </div>

        <button type="submit" class="btn btn-primary">Tạo mới</button>
      </form>
    </div>
  </section>

</body>
</html>
