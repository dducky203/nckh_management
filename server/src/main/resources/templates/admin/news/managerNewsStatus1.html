<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<section class="showcase"  layout:fragment="content">
    <div class="container my-5">
        <div class="row">
            <div class="col-12" th:each="n : ${news}" th:if="${n.status == 1}">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <!-- Dòng tiêu đề và thời gian -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title text-primary mb-0">
                                Tiêu đề: <span th:text="${n.title}"></span>
                            </h5>
                            <p class="mb-0 text-muted" th:if="${n.time != null}"
                               th:text="${#temporals.format(n.time, 'dd/MM/yyyy HH:mm')}"></p>
                        </div>

                        <!-- Nút xem chi tiết -->
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <a th:href="@{'/ad/managerNews/detail/'+${n.id}}" class="btn btn-outline-primary btn-sm">Xem chi tiết</a>
                            <span  style="color: red;margin-right: 2rem" th:if="${n.status==1}">Chờ duyệt</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav aria-label="Page navigation example" style="margin-left: 9.5rem" >
        <p >Bạn đang ở trang thứ <span th:text="${news.getNumber()+1}"></span></p>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link"
                   th:href="@{'/new/showNews/?size=' + ${news.size} + '&page=1'}"
                   style="text-decoration: none">
                    Trang đầu
                </a>
            </li>
            <div th:if="${news.totalPages > 0}" th:each="pageNumber : ${pageNumbers}">
                <li class="page-item" style="border: var(--bs-pagination-border-width) solid var(--bs-pagination-border-color);padding: 6px">
                    <a th:href="@{'/news/showNews/?size=' + ${news.size} + '&page=' + ${pageNumber}}"
                       th:text="${pageNumber}"
                       th:class="${pageNumber == news.number + 1} ? 'active'"
                       style="text-decoration: none" class="page-link">
                    </a>
                </li>
            </div>
            <li class="page-item">
                <a class="page-link"
                   th:if="${maxPageNumber !=null}"
                   style="text-decoration: none"
                   th:href="@{'/news/showNews/?size=' + ${news.size} + '&page=' + ${maxPageNumber}}"
                >
                    Trang cuối
                </a>
            </li>
        </ul>
    </nav>
</section>

</body>
</html>
